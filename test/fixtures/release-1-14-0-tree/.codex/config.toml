# stamity — Codex CLI configuration.
#
# stamity owns the [features] table and each [mcp_servers.<id>] table it renders; every
# other table and top-level key here is yours, and sync and clean keep it. A [features]
# table of your own is kept instead of this one; Codex runs hooks unless it sets
# `hooks = false`.
#
# Composed by one writer: the MCP server tables below are rendered from the curated
# catalog, and any adapter-level table joins them here rather than in a second file.
#
# Hooks: .codex/hooks.json · subagents: .codex/agents/ · standards: AGENTS.md.
#
# Lifecycle hooks: an emitted hooks.json is read only while this key is on. It is written
# explicitly, so the client's default does not decide it. Enabling it here is step 1 of 3.
#
# Three steps stand between this file and a hook the client runs.
# 1. Feature flag: `features.hooks = true` (deprecated alias `features.codex_hooks`); this file
#    is not read while it is off. .codex/config.toml writes it explicitly, so the client's
#    default does not decide it. The per-invocation equivalent is `codex exec --enable hooks`,
#    which is shorthand for `-c features.hooks=true`.
# 2. Project trust: a project `.codex/` layer loads only when it is trusted. Record
#    `projects.<path>.trust_level = "trusted"` in the Codex home config (`~/.codex/config.toml`),
#    which is the operator's file and not one this engine writes.
# 3. Per-hook review: each hook is trusted by hash through the interactive `/hooks` command.
#    Automation that cannot take that step runs `--dangerously-bypass-hook-trust`, which runs
#    enabled hooks with no persisted trust.
# Key set: learn.chatgpt.com/docs/config-file/config-reference (accessed 2026-09-15).
#
# Setting this key false makes every emitted hook inert with no other signal — the client
# reads none of them. Edit this table and it becomes yours: sync keeps it as you left it
# and stops refreshing it.
[features]
hooks = true

# No MCP servers selected.
[mcp_servers]
