# Dependabot — weekly update PRs for the two ecosystems this repository actually has.
#
# `directory` scoping is EXACT, not recursive: an entry for "/" covers the root manifest and
# nothing else. That is why there are TWO npm entries below rather than one. The second manifest
# the note here used to anticipate has landed — `website/package.json`, the Docusaurus site — and
# without its own entry it would silently receive no update PRs at all, which is how an advisory
# sits open for a month while the dashboard looks clean. One entry per npm manifest, and the rule
# for the next one is the same: add it here on the commit that adds the manifest.
# test/ci/workflow.test.ts holds that rule by asserting every npm entry's directory has a
# package.json in it, so a manifest without an entry, or an entry without a manifest, fails.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Two grouped PRs a week instead of one per package. The split is along the line that matters
    # when reviewing: a production bump changes what ships to users, a development bump changes
    # only what gates it, and the two deserve different scrutiny even when the diff looks alike.
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    # Deterministic, rather than inferred from commit history. The repository uses Conventional
    # Commits, and dependabot's auto-detection reads recent commits to guess the prefix — a guess
    # that changes as history changes.
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope

  # The docs site (`website/`). A separate npm project with its own lockfile: it ships nothing to
  # users — `package.json` publishes `dist` only — so every bump here is a bump to what RENDERS
  # the documentation, not to what runs on a consumer's machine. Same weekly cadence and the same
  # production/development split, so a site bump is reviewed on the same terms as a root one.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope

  # GitHub Actions are SHA-pinned with a trailing comment naming the exact version the SHA
  # resolves to. THE LESSON THIS COMMENT EXISTS TO CARRY: dependabot rewrites the digest on a bump
  # and mirrors the existing comment's GRANULARITY verbatim. A coarse `# v4` comment that gets
  # bumped across a major stays `# v4` — the pin is now v6 and the comment says v4, so the file
  # lies about the code it pins, and the lie is in the one place a reviewer looks to avoid reading
  # a 40-character hex string. There is no dependabot config key that forces a precise comment.
  #
  # So: write every pin comment as the full `# vMAJOR.MINOR.PATCH`, and when merging an Actions
  # PR, rewrite the comment to the precise version the new SHA resolves to. The backstop is
  # test/ci/workflow.test.ts, which fails on a `uses:` that is not SHA-pinned or whose comment is
  # not a full three-part version. That test cannot verify the SHA actually resolves to the
  # version named — it runs offline — so the shape is enforced and the truth of the mapping is on
  # the person merging. Re-resolve with:
  #   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
