# CI — the merge-blocking gate for this repository.
#
# Actions are pinned to full commit SHAs with a trailing comment naming the EXACT version the
# SHA resolves to. Pins resolved 2026-08-26 with:
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
# Re-run the same command against the new tag when bumping a pin, and rewrite the comment to the
# precise version — a coarse `# v4` comment that survives a major bump lies about the pinned code.
#
# Step order, the self-consistency gate, the aggregator, the per-leg step split and the pin policy
# are drift-guarded by test/ci/workflow.test.ts — edit both together.
#
# ─────────────────────────────────────────────────────────────────────────────
# LANE MAP — what runs, where it runs, and what it can block
#
# The rule this block exists to keep: a lane is named here or it does not exist, and a lane that
# is NOT run is named too. An unnamed gap reads exactly like a decision, and a reader cannot tell
# them apart.
#
# MERGE-BLOCKING (required through the `all-ci-checks` aggregator):
#   - `changes`, one leg, first. It decides which of the two sides below runs.
#     `scripts/ci/records-only.mjs` (the lane classifier; the name predates its other lanes) prints
#     `full=false` only when EVERY path the push or pull request changes falls in a lane:
#     `records` (`.stamity/runs/`, `.stamity/handoffs/`, `docs/plans/`, `.stamity/inbox.md`),
#     `specs` (`docs/specs/`), `learnings` (`.stamity/learnings/`) or `website` (`website/` and
#     every other `docs/` path); an engine `.gitkeep` is in none. One path in no lane (`README.md`
#     ships in the package, so it is one), a missing or all-zero base, a base git cannot find, the
#     weekly schedule and a manual dispatch all read `full=true`, which is full CI. It also prints
#     the lanes, their suites, `site_build`, `cli_check`, and `records_only` (kept one release,
#     read by nothing here; it leaves at the first release after the lanes merged). `site_build`
#     is true whenever the diff touches a `website` path, on a full answer too, and whenever the
#     diff could not be read, so no side of the split passes a site change it did not build.
#   - `prove-pr`, one leg, on a push to `main` only (skipped on every other trigger), beside
#     `changes`. `scripts/ci/pr-proven.mjs` prints `proven=true` only when the pushed commit's
#     tree equals the head tree of a pull request holding that commit, and that head's newest
#     `ci.yml` pull-request run passed: its latest attempt's one `all-ci-checks` job concluded
#     `success`. Then `check`, `apm-install`, `plugin-route` and `lanes` all skip: the tree they
#     would test is the one the pull request's run already passed. The evidence is this
#     workflow's own run, not the app that reports it: every workflow's jobs report as GitHub
#     Actions, so an `all-ci-checks` check run on the head from any other check suite is a second
#     producer. That, any other conclusion, a tree no head carries, and any failed, malformed or
#     stalled read all print `false`, which is full CI and never a red reader. The push-only
#     workflows (`pack-signing-rehearsal.yml`, `docs-site.yml`) are untouched and still run on
#     the push.
#   - `lanes`, one leg, and ONLY when `changes` said `full=false` and no push was proven. It stands
#     in for `check`, `apm-install` and `plugin-route`, which skip. No lane's paths feed the package
#     build or a published byte, so what a change can break is what reads them: the suites that
#     open the lanes' committed paths (the union of every entry a changed path matches in the
#     test-input map of the BASE commit's `.stamity/change-classes.json`, never the head's), the
#     generate-and-diff step, the leak gate, and on pull requests the hygiene
#     scan. The `learnings` lane adds the CLI build and its dogfood `check` (the session hook reads
#     the learnings); the `website` lane adds the docs site build and the root typecheck (a test
#     imports a `website/` module). The aggregator asserts which side ran, so a lanes pass can
#     never stand in for a full one.
#   - `check`, four legs, on every change no lane covers, unless `prove-pr` proved the push.
#     ubuntu on the declared engines floor (22.22.2) and on the LTS canonical (24), plus windows
#     on 24 as two legs that each run one half of the suite
#     (`--shard=1/2`, `--shard=2/2`). Every leg installs, builds and runs its tests through
#     `scripts/ci/test-run.mjs`; the floor, the LTS and the first windows shard also re-prove the
#     committed dogfood configs with the binary they just built and run the leak gate. The test
#     step re-runs a failure ONCE, and only when every failure is a vitest timeout: the failed
#     files on a windows shard, the whole suite with coverage on an ubuntu leg (a partial run
#     cannot meet the floors). A green re-run passes with a `flaky test` warning per file and a
#     step-summary line, never silently; an assertion failure, a timeout beside anything else, a
#     coverage floor, or any failure on the re-run is red. The floor leg additionally packs and
#     installs the tarball (`tarball-smoke`), because the published SHAPE is a different tree
#     from the repository. On pull requests the LTS leg also rejects tracked runtime files, new
#     raw evidence, and growth beyond file budgets. When `changes` reports `site_build` (a change
#     mixing a `website` path with one in no lane, or a diff it could not read), the LTS leg also
#     builds the docs site, last, with docs-site.yml's own steps.
#   - `apm-install`, three legs. The APM route, proven by what a real consumer's tree HOLDS after
#     an install rather than by the exit code — the routing failure this lane exists for exited 0
#     and deployed nothing. Two legs install the package with a fixed client (0.29.1, the minimum
#     tested one, and 0.30.0, the current one); the third runs the same smoke on 0.29.0 with
#     `--expect-failure`, so the lane goes red if it ever stops being able to see that failure.
#   - `plugin-route`, one leg. The CLIENT route into the four plugin roots this repository builds,
#     read by the clients themselves rather than by a generator's own byte-diff. What it PROVES:
#     the four roots' structure on every run — each root's `stamity-plugin.json` parses, every
#     carried class's file count equals its declaration, and the container manifest validates —
#     plus, on the clients whose CLI installs on the runner, each client's CREDENTIAL-FREE install
#     and the discovery leg a credential-free LISTING command can answer — Copilot alone, whose
#     `skill list` names skills and commands without an account (its agent marker still waits for
#     a transcript). What it does NOT prove: discovery wherever it has to be read out of an
#     invocation TRANSCRIPT — Claude and Cursor, whose only listing of a plugin's ids is what a
#     driven session prints, and Codex, whose `plugin list --json` names the plugin and not its
#     skills, so the smoke SKIPs its discovery without `--invoke` — and every invocation leg. All
#     of those need a vendor credential this job holds none of, so they run
#     in two other places: the nightly lane (.github/workflows/nightly.yml), behind per-client
#     secrets, and the QA harness on the maintainer's machine against the logged-in binaries. A CLI
#     that fails to install here leaves its legs SKIPPED with the installer's stderr in the log and
#     a notice naming it; a structure failure, or any leg FAIL, is red. So what the merge gate
#     holds is the credential-free half of the route, which holds on every runner.
#   - The aggregator itself. It is the ONE required status context THIS file exposes: the legs
#     name themselves per leg, so a rule written against them binds names that rotate with the
#     matrix.
#   - `pr-checks` (.github/workflows/pr-checks.yml), on pull requests only, exposing a second
#     required context `all-pr-checks`. It carries the three gates that can only be answered
#     about a pull request — the DCO trailer on every commit, the conventional-commit title, and
#     the dual dist size budget. They are not in this file because a job that is skipped on three
#     of this workflow's four triggers would be a required check that reads as green.
#
# ADVISORY (reported, never required):
#   - `supply-chain`: npm audit over declared dependencies, an OSV querybatch over every
#     exact-pinned MCP catalog row, pin deprecation and staleness, and both currency dates.
#   - `dependency-review` on pull requests: the incoming diff's new dependencies against the
#     advisory database. Non-blocking for a reason named at the job.
#
# NOT RUN — and why:
#   1. Secret scanning across HISTORY. The shape pass in `leak-gate` covers the working tree and,
#      through `tarball-smoke`, the packed artifact. Scanning history needs a scanner allowlist
#      for the placeholder credentials the corpus documents, which is a decision not yet made.
#      GitHub push protection is a repository setting rather than a file edit and lands with it.
#   2. Lockfile linting. It needs a registry policy first — which registries a resolved URL may
#      point at, and what an integrity-less entry means. Without that policy the lint has no
#      pass condition, so it would be a lane that always passes.
#   3. Code scanning (CodeQL) and OpenSSF Scorecard. Both are as much repository-settings
#      decisions as workflow files: CodeQL needs a language and query-suite choice, and Scorecard
#      grades the settings surface — branch protection, the required-context set, the tag ruleset
#      — which no file in this directory can set. They land with the settings pass that owns
#      those, and grading a configuration mid-write would produce a number nobody should act on.
#   4. The eval harness. Named last because it is the one gap with downstream dependents already
#      written against it: the `obsolete_when` triggers across the corpus have nothing that fires
#      them, the per-unit size defaults are unmeasured estimates rather than observed
#      distributions, and the headline quality metric has no instrument behind it. All three read
#      as calibrated today and are not. The nightly headless lane (.github/workflows/nightly.yml)
#      is where that harness will attach; it is wired and credential-gated, not yet implemented.
#      Its drive step is no longer empty — it now runs the plugin-route INVOCATION legs behind the
#      per-client secrets — but driving a client and scoring the run are two different things, and
#      only the first of them exists. Nothing in this repository measures the three items above.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Weekly, so pin currency is a standing duty rather than a side effect of pushing.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  # The event name is part of the group on purpose. With one group across every trigger, a Monday
  # schedule run and a push to `main` cancelled each other — including the blocking gate — and
  # left a commit on `main` carrying a CANCELLED check rather than a passing one. Superseding a
  # run is only correct within one event stream, and a pull_request run must never cancel the
  # push run for the same ref.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lanes or full: the one question every other lane in this file waits on. It runs on every
  # trigger with no condition, so the answer always exists; a failure here skips every lane that
  # needs it and the aggregator goes red, which is the fail-closed direction. The full history is
  # fetched because the base can be many commits back (a push of several commits, or a pull
  # request's base), and the base arrives as data through `env:`, never interpolated into the
  # script body. On the schedule and a dispatch both halves of the expression are empty, and the
  # detector reads that as full CI.
  changes:
    name: changes (lanes or full)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      full: ${{ steps.classify.outputs.full }}
      lanes: ${{ steps.classify.outputs.lanes }}
      suites: ${{ steps.classify.outputs.suites }}
      site_build: ${{ steps.classify.outputs.site_build }}
      cli_check: ${{ steps.classify.outputs.cli_check }}
      # Kept one release for any reader of the old output; nothing in this file reads it. Remove it
      # at the first release after the lanes merged, with the classifier's line that prints it.
      records_only: ${{ steps.classify.outputs.records_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # No `cache: npm` and no install: the detector is plain ESM over Node built-ins and git.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Classify the change
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci/records-only.mjs --base "$BASE_SHA"

  # Proven or not: on a push to `main`, whether a pull request already passed the pushed tree. It
  # runs beside `changes` with no dependency, on a push to `main` only; on every other trigger it is
  # skipped and reads as not proven. Only `ci.yml`'s own pull-request run on the head counts as
  # evidence, read through the Actions API (`actions: read`): every workflow's jobs report as the
  # GitHub Actions app, so an `all-ci-checks` check run from any other check suite on that head is a
  # second producer and reads not proven. Every failed, malformed or stalled read prints
  # `proven=false` and exits 0 (each read has a timeout), so a rate limit, a 404 or a hang means
  # full CI rather than a red job. The four lanes it gates carry `!cancelled()`
  # because a job whose need was skipped is itself skipped unless its `if` calls a status function,
  # and `needs.changes.result == 'success'` puts back the guard the implicit `success()` gave.
  prove-pr:
    name: prove-pr (a push whose tree a pull request proved)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      checks: read
      pull-requests: read
    outputs:
      proven: ${{ steps.prove.outputs.proven }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # No `cache: npm` and no install: the reader is plain ESM over Node built-ins and `gh`.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Read the pull request's run
        id: prove
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSHED_SHA: ${{ github.sha }}
        run: node scripts/ci/pr-proven.mjs --sha "$PUSHED_SHA"

  check:
    name: check (${{ matrix.label }}, node ${{ matrix.node }})
    needs: [changes, prove-pr]
    if: "!cancelled() && needs.changes.result == 'success' && (needs.prove-pr.result == 'success' || needs.prove-pr.result == 'skipped') && needs.prove-pr.outputs.proven != 'true' && needs.changes.outputs.full != 'false'"
    runs-on: ${{ matrix.os }}
    # 30, not the 15 this job carried while it was ubuntu-only: a windows leg installs, builds
    # and runs its half of the suite on the slowest runner image in the matrix, a timeout-only
    # failure can run its files a second time, and a ceiling that a healthy run brushes against
    # is a flake generator rather than a hang detector. Measured on main's green runs of
    # 2026-09-29 (36627490873, 36587123668): an ubuntu leg's coverage step took 3.7-4.9 min in a
    # 4.3-5.5 min job, so a coverage leg's full re-run lands near 11 min; the unsharded windows
    # Test step took 13-14 min, of which a shard runs about half before any re-run of its files.
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Four legs, each earning its place. `label` names the leg in the job title; the boolean
        # flags below are the per-leg step split, declared here rather than repeated as
        # `matrix.os == ... && matrix.node == ...` on every conditional step.
        include:
          # The declared engines floor, pinned exactly, so a newer-than-floor API fails here
          # rather than in a user's install. It carries the publish-shape gate because what that
          # gate proves is a RUNTIME claim: the published artifact installs and runs on the
          # oldest Node this package claims to support.
          - os: ubuntu-latest
            node: '22.22.2'
            label: floor
            coverage: true
            tarball_smoke: true
          # The LTS canonical, and the one leg every toolchain step runs on. The four steps
          # answer questions that depend on neither the OS nor the Node version, so a second
          # copy of them buys no coverage. Until the floor moved to 22.22.2 there was a second
          # reason — tsdown declares ^22.18.0 and eslint ^22.13.0, both of which the old 22.12.0
          # floor sat below — and the raised floor satisfies both, so what is left is the
          # duplication argument alone.
          - os: ubuntu-latest
            node: '24'
            label: lts
            coverage: true
            toolchain: true
          # Windows, on the LTS canonical, as two shards. Path separators, the absence of POSIX
          # file modes, and CRLF are the three things a POSIX-only matrix cannot see; the suite
          # already carries `skipIf(process.platform === "win32")` guards for the mode- and
          # symlink-dependent cases, so what runs here is the portable majority of the suite,
          # split in two so neither half runs the whole of it on the slowest runner image, plus
          # the two runtime gates (`check`, the leak gate) that matter most to a Windows user —
          # on the first shard only, since they read the checkout and the binary, not the half
          # of the suite a shard ran. Both shards are legs of `check`, so the aggregator needs
          # both.
          - os: windows-latest
            node: '24'
            label: windows-1
            shard: '1/2'
          - os: windows-latest
            node: '24'
            label: windows-2
            shard: '2/2'

    steps:
      # BEFORE checkout, and only on windows. Three layers hold LF here, and this step is the
      # middle one. The root .gitattributes (`* text=auto eol=lf`) pins the checkout to LF on any
      # Git that honours attributes; this step is the defence for the runner's global config,
      # where Git's default `core.autocrlf=true` on Windows is what rewrites LF to CRLF as it
      # writes the working tree, so no leg rests on attribute handling alone; and
      # src/merge/safeWrite.ts and src/merge/reclaim.ts fold CRLF at read time for clones made
      # before the attribute existed. Rewritten bytes would break the two gates that compare
      # bytes: `check` diffs regenerated output against the committed files, and the golden
      # suites compare emitted content to fixtures on disk. The failure would be a line-ending
      # artifact reported as a content drift — a false red that teaches the reader to distrust
      # the gate. A step may precede `actions/checkout`; `git config --global` needs no
      # repository.
      - name: Pin line endings before checkout
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The PR hygiene comparison needs its base; other legs keep their shallow checkout.
          # String '0' stays truthy through Actions' &&/|| conditional expression.
          fetch-depth: ${{ matrix.toolchain && github.event_name == 'pull_request' && '0' || '1' }}

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `.npmrc` sets ignore-scripts=true and npm reads it from the working directory, so no
      # dependency lifecycle script runs on any leg. Without it every transitive package's
      # install hooks execute on the runner before a single gate has looked at anything.
      - name: Install
        run: npm ci

      # Typecheck, Lint, Self-consistency and knip answer questions that do not depend on the
      # Node version or the operating system. One leg each.
      - name: Typecheck
        if: matrix.toolchain
        run: npm run typecheck

      - name: Lint
        if: matrix.toolchain
        run: npm run lint

      # Inside the required check job: a finding fails all-ci-checks through this matrix leg.
      - name: Repository hygiene
        if: matrix.toolchain && github.event_name == 'pull_request'
        env:
          HYGIENE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/repo-hygiene.mjs --base "$HYGIENE_BASE_REF"

      # Build precedes Test so the dist journey (test/cli/dogfoodDist.e2e.test.ts)
      # always runs against the fresh build here and its local self-build fallback
      # never fires in CI.
      - name: Build
        run: npm run build

      # Coverage runs on the legs whose floors it can meet. vitest.config.ts holds the merge and
      # emit core at 100% and those floors are BLOCKING; the windows legs skip the mode- and
      # symlink-dependent cases under test/merge/ and test/mcp/ by platform guard, so a coverage
      # run there would report a shortfall that is a property of the platform, not of the change.
      # The floors are unchanged and still gate — on both ubuntu legs. Windows runs the same
      # suite, one shard per leg, without the coverage instrument.
      #
      # Both steps run vitest through scripts/ci/test-run.mjs, which re-runs a timeout-only
      # failure once and reports a green re-run as a flaky test (see the lane map above). On a
      # coverage leg the re-run is the whole suite with coverage again, so a floor is never read
      # off a partial run.
      - name: Test with coverage floors
        if: matrix.coverage
        run: node scripts/ci/test-run.mjs --coverage

      # The shard arrives as data through `env:`. bash, not the windows default pwsh, because
      # pwsh would read `$TEST_SHARD` as an unset PowerShell variable and run the whole suite.
      - name: Test
        if: ${{ !matrix.coverage }}
        shell: bash
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: node scripts/ci/test-run.mjs --shard="$TEST_SHARD"

      # Every generated artifact class, regenerated and byte-diffed: the capability
      # matrix, the CLI/config/reference/llms pages, the catalog pins, the four
      # plugin/marketplace manifests, and the APM package — `apm.yml` plus the whole
      # `.apm/` primitive tree (the last three verified in --check mode — this
      # step writes nothing but regenerated tracked pages).
      # The generators run on Node's own type stripping and need no build.
      # `git diff --exit-code` ignores untracked files by design, so gitignored
      # output (coverage/, dist/) cannot trip the gate — do not swap in
      # `git status --porcelain`, which would.
      - name: Self-consistency (generate-and-diff)
        if: matrix.toolchain
        run: >-
          node scripts/generate-capability-matrix.mjs &&
          node scripts/generate-docs.mjs &&
          node scripts/generate-pack-manifests.mjs --check &&
          node scripts/generate-plugin-manifests.mjs --check &&
          node scripts/generate-apm-package.mjs --check &&
          git diff --exit-code

      # The committed self-configs — AGENTS.md and the generated client trees — re-proven
      # drift-clean by the binary this job just built. The living integration test. `check` reads
      # the committed manifest at the repository root and needs no branch, so it runs on CI's
      # detached HEAD as-is. One leg per OS and Node pair: this is runtime verification of the
      # shipped binary, which is exactly what the floor and windows legs exist to prove, and the
      # second windows shard's checkout and binary are the first one's.
      - name: Dogfood check
        if: matrix.shard != '2/2'
        run: node dist/cli.js check

      - name: Leak gate
        if: matrix.shard != '2/2'
        run: npm run gate

      # Engine floor calls for knip in CI, not only as a local script.
      - name: Unused code and dependencies
        if: matrix.toolchain
        run: npm run knip

      # The published SHAPE, not the repository's: pack the tarball, install it into a
      # throwaway project, run the leak gate over the packed tree (the one tree the
      # repository scan cannot see, because `dist/` is a skipped build directory here and is
      # the whole payload there), then init + check. Every other step in this job resolves the
      # corpus through `<packageRoot>/content` (the source checkout), which exists here and
      # never exists for a user — so this is the only gate that can catch a build that forgot
      # to stage `dist/content` and would publish a package whose first command exits
      # CONFIG_ERROR.
      - name: Tarball smoke (publish shape)
        if: matrix.tarball_smoke
        run: node scripts/tarball-smoke.mjs

      # The docs site, on the full side: a change mixing a `website` path with a path in no lane
      # takes this matrix and not the `lanes` job, and `all-ci-checks` must never pass a website
      # change whose site does not build. So the LTS leg builds it whenever `changes` reports
      # `site_build` (and on an absent answer, the full side's fail-closed direction), with the
      # steps docs-site.yml builds with, LAST, so no gate above reads the site's install or output.
      - name: Set up Node for the site
        if: matrix.toolchain && needs.changes.outputs.site_build != 'false'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json

      # `--ignore-scripts` spelled out, for the reason docs-site.yml's install step gives: the root
      # `.npmrc` does not reach an install whose project root is `website/`.
      - name: Install the site
        if: matrix.toolchain && needs.changes.outputs.site_build != 'false'
        working-directory: website
        run: npm ci --ignore-scripts

      - name: Build the site
        if: matrix.toolchain && needs.changes.outputs.site_build != 'false'
        working-directory: website
        run: npm run build

  # The regression gate on the APM route, and the one lane in this file that reads a DEPLOYED
  # TREE rather than a command's exit code.
  #
  # The failure it guards is a mixed-manifest routing failure, and it reported success for weeks.
  # This repository's root carries both Claude plugin surfaces AND the generated APM surface
  # (`apm.yml` + `.apm/`), and through apm 0.29.0 the type-detection cascade ranked the plugin
  # manifest ahead of the APM package: `apm install` typed the tree as an Agent Plugin, exited 0,
  # and deployed not one primitive (microsoft/apm#2735, closed by PR #2776 and shipped in 0.29.1).
  # Nothing else here could see it — the package's bytes were correct throughout, so the
  # generate-and-diff step above was green the whole time.
  #
  # The minimum tested client is 0.29.1. No key in `apm.yml` can declare a client floor, so the
  # floor is a tested claim or it is nothing; `current` tracks the stable release beside it. The
  # `regression-witness` leg runs the same smoke against 0.29.0 with `--expect-failure` and passes
  # only when the check still DETECTS the original failure — without it, a smoke that quietly
  # stopped being able to fail would read exactly like a smoke that keeps passing.
  apm-install:
    name: apm route (${{ matrix.role }}, apm ${{ matrix.apm }})
    needs: [changes, prove-pr]
    if: "!cancelled() && needs.changes.result == 'success' && (needs.prove-pr.result == 'success' || needs.prove-pr.result == 'skipped') && needs.prove-pr.outputs.proven != 'true' && needs.changes.outputs.full != 'false'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - apm: '0.29.1'
            role: minimum
          - apm: '0.30.0'
            role: current
          - apm: '0.29.0'
            role: regression-witness
            expect_failure: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `cache: npm`, and no `npm ci` below it: the smoke is plain ESM over Node built-ins, and
      # the package it installs is the `.apm/` tree already in this checkout. A dependency install
      # here would buy nothing and hand this leg a supply chain it does not need.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'

      # Pinned rather than inherited from the runner image, so an image refresh cannot move the
      # interpreter under a matrix whose whole point is that only the apm version varies. apm-cli
      # declares `python >= 3.10`.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # A venv, not a bare `pip install`: the runner image's system Python is externally managed,
      # and this leg has to hold exactly ONE apm — the matrix is the experiment. The version
      # reaches pip through `env:` rather than a `${{ }}` interpolation in the script body, like
      # every other value in this directory.
      #
      # It lives in RUNNER_TEMP rather than in the working tree, and that placement is
      # load-bearing rather than tidy: the smoke's default source is a CLEAN EXPORT of this
      # checkout built from `git ls-files --cached --others --exclude-standard`, so a venv sitting
      # untracked-and-unignored beside the code would be exported into the consumer as part of the
      # package under test.
      - name: Install apm-cli ${{ matrix.apm }}
        env:
          APM: ${{ matrix.apm }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/apm-venv"
          "$RUNNER_TEMP/apm-venv/bin/pip" install --quiet "apm-cli==${APM}"
          "$RUNNER_TEMP/apm-venv/bin/apm" --version

      # Four targets, because each one has its own deployment paths and its own translation of the
      # same primitive — a route proven on `claude` alone would say nothing about the other three.
      - name: APM route smoke
        if: ${{ !matrix.expect_failure }}
        run: node scripts/apm-install-smoke.mjs --apm "$RUNNER_TEMP/apm-venv/bin/apm" --targets claude,copilot,cursor,codex

      # Inverted on purpose: this leg PASSES when the install fails to deploy and the smoke says
      # so, and FAILS when a client from before the fix somehow deploys everything — which would
      # mean the gate above is measuring something other than what it claims.
      - name: APM route smoke (regression witness)
        if: matrix.expect_failure
        run: node scripts/apm-install-smoke.mjs --apm "$RUNNER_TEMP/apm-venv/bin/apm" --targets claude,copilot,cursor,codex --expect-failure

  # The CLIENT route into the plugin distribution, and the second lane in this file that reads a
  # TREE a third party produced rather than a command's exit code.
  #
  # Every other gate on the distribution compares bytes a generator in this repository wrote
  # against bytes the same generator writes again — `generate-plugin-manifests.mjs --check` in
  # `check` above is exactly that. A generator agreeing with itself says nothing about whether a
  # client can read the result, which is the whole claim the distribution makes. So this lane
  # builds the four roots the release builds, with the same three lines, and then asks the clients.
  #
  # The credential boundary is what shapes it, and it does not fall neatly between legs — it falls
  # through the middle of one. `structure` needs no client at all and runs on every leg. `install`
  # needs the client's BINARY but no account (`claude plugin validate`, a marketplace add into a
  # scratch HOME, a deployed-tree comparison). `discovery` splits: where the client has a listing
  # command that answers without an account it runs here, and where the only listing of a plugin's
  # ids is what a driven session PRINTS it cannot — that reading needs a credential exactly as
  # `invocation` does. So this job runs structure, install, and the credential-free half of
  # discovery; the transcript half and every invocation leg run in the nightly lane behind
  # per-client secrets and in the QA harness on the maintainer's machine.
  #
  # Which clients fall on which side of that split is the SMOKE's answer, not this file's: a listing
  # command that turns out to need an account is a SKIPPED leg with its reason. What the smoke
  # answers today (read off its legs on 2026-09-22; the smoke is the source when the two disagree):
  # Copilot's discovery runs here, from `skill list`, and resolves the command and skill markers
  # while its agent marker waits for a transcript; Codex's does NOT — `plugin list --json` names
  # the plugin and not its skills, so the leg is SKIPPED here and measured only under `--invoke`;
  # Claude and Cursor have no listing at all without a model call. So per client this job proves:
  # claude — structure and `plugin validate --strict`; copilot — structure, the marketplace install
  # and the listing half of discovery; codex — structure and the marketplace install; cursor —
  # structure only. A lane that flattened the split would report a route as proven on the strength
  # of a structure check.
  #
  # Every vendor install is best-effort on purpose: an npm outage or a vendor installer change is a
  # fact about the world on the day the run happened, not about the diff, and a merge gate that
  # goes red on it teaches the reader to wave the lane through. The smoke's own contract carries
  # that posture — a client whose binary is neither passed nor exported has its binary-bound legs
  # SKIPPED — so the structure claim still gates on every run.
  plugin-route:
    name: plugin route (structure and credential-free install)
    needs: [changes, prove-pr]
    if: "!cancelled() && needs.changes.result == 'success' && (needs.prove-pr.result == 'success' || needs.prove-pr.result == 'skipped') && needs.prove-pr.outputs.proven != 'true' && needs.changes.outputs.full != 'false'"
    runs-on: ubuntu-latest
    # 15, and derived rather than chosen. The three build lines were measured at ~20 s total on
    # 2026-09-20 with `time npm pack --pack-destination "$WORK"` (0.5 s), `time node
    # scripts/build-plugin-runtime.mjs …` (0.6 s) and `time node
    # scripts/build-plugin-distribution.mjs …` (18.3 s) on darwin 25.6.0 with a warm npm cache;
    # the checkout, `npm ci` and `npm run build` ahead of them are the `check` job's own first
    # four steps. What is NOT measured is the install half — three global npm installs and one
    # vendor shell installer, all network-bound, on a runner nobody has timed this job on yet. So
    # the ceiling is `apm-install`'s 15 on the same runner shape rather than a number derived from
    # a measurement that does not exist; re-derive it from the first ten runs of this lane.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # The release workflow's own three lines, in the same order and with the same provenance
      # inputs, because a lane that built the distribution a second way would prove a tree the
      # release never ships. The runtime comes from the TARBALL rather than the checkout for the
      # reason release.yml states: `npm pack` is the only thing that knows what `files` publishes.
      #
      # Both trees land under `dist/`, which is gitignored: an untracked `plugin-runtime/` beside
      # the checkout would enter `git ls-files --others`, the scan the leak gate itself runs.
      - name: Build the distribution
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          npm pack --pack-destination "$WORK"
          TARBALL="$(ls -1 "$WORK"/*.tgz | head -1)"
          test -f "$TARBALL"
          node scripts/build-plugin-runtime.mjs --tarball "$TARBALL" --out dist/plugin-runtime
          node scripts/build-plugin-distribution.mjs \
            --out dist/plugins \
            --runtime dist/plugin-runtime \
            --source-commit "$GITHUB_SHA" \
            --source-commit-date "$(git show -s --format=%cI "$GITHUB_SHA")"

      # Captured BEFORE any vendor install, and used by the smoke step below: the same addressing
      # nightly.yml's headless lane applies (its block comment above the build step states the
      # mechanism and the measurements), because a global npm install writes into the toolcache's
      # bin directory — where `node` itself lives — and runs vendor lifecycle scripts, and the
      # Cursor installer writes `$HOME/.local/bin`, which the ubuntu image already has on PATH.
      # This job holds no credential, so the exposure here is the tree and the log rather than a
      # secret; the shape is kept identical to the nightly's so the two cannot drift apart.
      - name: Capture the interpreter before any vendor install
        run: |
          set -euo pipefail
          NODE_BIN="$(command -v node)"
          echo "STAMITY_NODE_BIN=$NODE_BIN" >> "$GITHUB_ENV"
          echo "STAMITY_NODE_BIN=$NODE_BIN"

      # One step per client, so the log names which vendor failed rather than which line of a
      # four-vendor script did. Two layers hold each of them off the merge path: the `if` branch
      # turns the installer's own non-zero into a notice and a missing output, and
      # `continue-on-error: true` catches what the branch cannot — the step being killed, or the
      # shell aborting before either arm runs.
      #
      # Each npm-published CLI lands under its own `$RUNNER_TEMP/<vendor>` prefix with
      # `--ignore-scripts` — npm reads the project `.npmrc`'s `ignore-scripts=true` in local mode
      # only. `npm view <package> scripts` on 2026-09-22: `@anthropic-ai/claude-code` declares
      # `postinstall: node install.cjs`, which copies the platform binary over the `bin/claude.exe`
      # placeholder and without which `claude --version` exits 1 "claude native binary not
      # installed" (measured), so that one file is run by name after the install; `@github/copilot`
      # and `@openai/codex` declare none and answer `--version` with scripts ignored (measured).
      - name: Install the Claude Code CLI
        id: cli-claude
        continue-on-error: true
        run: |
          if npm install -g --prefix "$RUNNER_TEMP/claude" --ignore-scripts @anthropic-ai/claude-code \
            && "$STAMITY_NODE_BIN" "$RUNNER_TEMP/claude/lib/node_modules/@anthropic-ai/claude-code/install.cjs"; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Claude Code CLI not installed::npm install -g @anthropic-ai/claude-code exited non-zero on this runner, so every binary-bound claude leg records SKIPPED. The installer's own stderr is in this step's log."
          fi

      - name: Install the GitHub Copilot CLI
        id: cli-copilot
        continue-on-error: true
        run: |
          if npm install -g --prefix "$RUNNER_TEMP/copilot" --ignore-scripts @github/copilot; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Copilot CLI not installed::npm install -g @github/copilot exited non-zero on this runner, so every binary-bound copilot leg records SKIPPED. The installer's own stderr is in this step's log."
          fi

      - name: Install the Codex CLI
        id: cli-codex
        continue-on-error: true
        run: |
          if npm install -g --prefix "$RUNNER_TEMP/codex" --ignore-scripts @openai/codex; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Codex CLI not installed::npm install -g @openai/codex exited non-zero on this runner, so every binary-bound codex leg records SKIPPED. The installer's own stderr is in this step's log."
          fi

      # The one client with no npm route. The vendor ships the agent CLI through a shell installer
      # and publishes no first-party package: the npm registry was queried on 2026-09-20 for
      # `cursor-agent`, `cursor-cli`, `@cursor/agent` and `@cursor/cli` — the two that resolve are
      # unrelated packages that declare no `bin`, and the other two do not exist. So the pipe is
      # the supported route rather than a shortcut, and it is scoped to the one job in this file
      # that holds `contents: read`, no credential and no write grant. `-fsS` keeps a 404 or a
      # redirect to an error page from being fed to bash as a script.
      #
      # The install directory is `$HOME/.local/bin`, with the binary named `agent` and symlinked
      # into `$HOME/.local/share/cursor-agent/versions/<version>/cursor-agent`. That layout is
      # read off an installed 2026.09.15 agent CLI on the maintainer's machine (`ls -la
      # ~/.local/bin/agent`, 2026-09-20) rather than off the vendor's installation page, which
      # refused every TLS connection from the build machine that day. Nothing is appended to
      # `GITHUB_PATH`: the export step reads the binary at that absolute path. The lane this step
      # belongs to, and what it is meant to prove, are specified in
      # docs/plans/008-plugin-lifecycle-03.md, cell V1 — read that rather than a run log, which
      # records what one session did rather than what this step is for.
      - name: Install the Cursor agent CLI
        id: cli-cursor
        continue-on-error: true
        run: |
          if curl -fsS https://cursor.com/install | bash; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Cursor agent CLI not installed::The vendor shell installer at https://cursor.com/install exited non-zero on this runner, so every binary-bound cursor leg records SKIPPED. The installer's own stderr is in this step's log."
          fi

      # Each binary at the absolute path its installer owns — never `command -v`, which is the PATH
      # resolution the capture step above exists to avoid, and never the four install steps'
      # outputs, because what the smoke needs is a path on this runner: an install that reported
      # success and left no executable at its path is the same SKIPPED leg as an install that
      # failed, and this step is where the two stop looking different. The absent case is a
      # notice, never a failure — the smoke's contract is that a client with no exported binary
      # has its binary-bound legs SKIPPED. Byte-identical to nightly.yml's export step, and pinned
      # so by the workflow test, which executes this copy.
      - name: Export the client binaries
        run: |
          set -euo pipefail
          for pair in \
            "CLAUDE claude $RUNNER_TEMP/claude/bin/claude" \
            "CURSOR agent $HOME/.local/bin/agent" \
            "COPILOT copilot $RUNNER_TEMP/copilot/bin/copilot" \
            "CODEX codex $RUNNER_TEMP/codex/bin/codex"
          do
            IFS=' ' read -r name bin path <<< "$pair"
            if [ -x "$path" ]; then
              echo "STAMITY_${name}_BIN=$path" >> "$GITHUB_ENV"
              echo "STAMITY_${name}_BIN=$path"
            else
              echo "::notice title=Client binary absent (${bin})::No executable at ${path} after the install step, so STAMITY_${name}_BIN is unset and every binary-bound leg of that client records SKIPPED."
            fi
          done

      # Without `--invoke`: the structure and install legs are exactly the ones that need no
      # account. The smoke exits 0 when no leg failed, 1 on a FAIL and 2 when it could not run at
      # all, so a SKIPPED leg is green here and a broken root is not. `node` by the path captured
      # before the installs, under a PATH with nothing a vendor installer wrote on it.
      - name: Plugin route smoke (no invocation legs)
        run: |
          set -euo pipefail
          export PATH="$(dirname "$STAMITY_NODE_BIN"):/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          "$STAMITY_NODE_BIN" scripts/plugin-route-smoke.mjs --dist dist/plugins --client claude,cursor,copilot,codex

  # The short side, for a push or pull request whose every changed path falls in a lane. It
  # replaces `check`, `apm-install` and `plugin-route` rather than running beside them, so its
  # steps are exactly what a lane's paths can break: the suites that read them (the union the base
  # commit's test-input map gives the changed paths, arriving as data through `env:` — that map
  # is the one source of the lists), the generate-and-diff step — the measurements
  # page renders from the committed runs and the reference pages live under `docs/`, and the
  # generators need no build — the leak gate over the whole tree, and on pull requests the same
  # hygiene scan the `check` LTS leg runs. Then, only for the lanes that ask: the CLI build and its
  # dogfood `check` for `learnings`, and the root typecheck and the docs site build (docs-site.yml's
  # own steps) for `website`. The builds come AFTER the suites, so no suite can quietly start
  # depending on one.
  lanes:
    name: lanes (records, specs, learnings and website changes)
    needs: [changes, prove-pr]
    if: "!cancelled() && needs.changes.result == 'success' && (needs.prove-pr.result == 'success' || needs.prove-pr.result == 'skipped') && needs.prove-pr.outputs.proven != 'true' && needs.changes.outputs.full == 'false'"
    runs-on: ubuntu-latest
    # 20: the records suites measured 85 s on 2026-09-30 (`npx vitest run` over the five entries,
    # darwin, no dist/) inside the 15 the records lane carried; the website lane adds a site
    # install and build, which docs-site.yml's build job holds under its own 15.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The PR hygiene comparison needs its base; a push keeps the shallow checkout.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Repository hygiene
        if: github.event_name == 'pull_request'
        env:
          HYGIENE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/repo-hygiene.mjs --base "$HYGIENE_BASE_REF"

      # Unquoted on purpose: the list is space-joined suite paths from the base commit's class file,
      # validated by `parseClassFile` (no whitespace, no leading `-`, no glob character), never
      # from the diff, and each word is one vitest filter.
      - name: Lane suites
        env:
          SUITES: ${{ needs.changes.outputs.suites }}
        run: npx vitest run $SUITES

      - name: Self-consistency (generate-and-diff)
        run: >-
          node scripts/generate-capability-matrix.mjs &&
          node scripts/generate-docs.mjs &&
          node scripts/generate-pack-manifests.mjs --check &&
          node scripts/generate-plugin-manifests.mjs --check &&
          node scripts/generate-apm-package.mjs --check &&
          git diff --exit-code

      - name: Leak gate
        run: npm run gate

      # The root typecheck for the website lane: `tsconfig.json` takes in `test/**`, and a test
      # imports `website/src/rehype/tableHeaderScope.mjs` under `@ts-expect-error`, so a website
      # change can turn it red, and a proven push skips `main`'s matrix that would catch it. On
      # this side `site_build` is exactly the website lane.
      - name: Typecheck
        if: needs.changes.outputs.site_build == 'true'
        run: npm run typecheck

      - name: Build
        if: needs.changes.outputs.cli_check == 'true'
        run: npm run build

      - name: Dogfood check
        if: needs.changes.outputs.cli_check == 'true'
        run: node dist/cli.js check

      - name: Set up Node for the site
        if: needs.changes.outputs.site_build == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json

      # `--ignore-scripts` spelled out, for the reason docs-site.yml's install step gives: the root
      # `.npmrc` does not reach an install whose project root is `website/`.
      - name: Install the site
        if: needs.changes.outputs.site_build == 'true'
        working-directory: website
        run: npm ci --ignore-scripts

      - name: Build the site
        if: needs.changes.outputs.site_build == 'true'
        working-directory: website
        run: npm run build

  # Currency, not integrity. The exact pins in the MCP catalog guarantee the bytes never
  # change, which is precisely why something has to go and ask whether those bytes are still
  # a good idea — a pinned version stays byte-identical on the day an advisory lands against
  # it. Advisory-only and separated from `check` so a published CVE informs the maintainer
  # without reddening a push to `main`, and scheduled so the answer does not depend on
  # someone happening to push.
  supply-chain:
    name: supply-chain currency (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      # Published advisories against every exact-pinned catalog row (OSV), plus whether each
      # pinned version is still published, has been deprecated upstream, or has fallen behind,
      # plus whether either currency date has aged past its window. Findings are emitted as
      # workflow annotations and into the step summary, so a non-blocking lane still reports
      # somewhere a maintainer looks.
      - name: Advisory and pin-currency check
        run: node scripts/advisory-check.mjs

  # What the incoming diff ADDS, which no other lane looks at: `supply-chain` audits the
  # dependencies already declared on the branch it runs from, so a pull request that introduces a
  # vulnerable package is only caught after it has landed. This job reads the diff itself.
  #
  # pull_request only — there is no diff to review on a push, a dispatch or a schedule.
  #
  # Advisory, and honestly so: the Dependency Review API this action calls is available on public
  # repositories and on private repositories with GitHub Advanced Security enabled. On a private
  # repository without it the call returns 403, which is a fact about the plan and not about the
  # diff. `continue-on-error` keeps that fact off the merge path, and the follow-up step says out
  # loud which of the two happened, so a skipped review is never mistaken for a clean one.
  dependency-review:
    name: dependency review (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        id: review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      # `continue-on-error` flips the step's CONCLUSION to success while leaving its OUTCOME at
      # the real value, so this guard cannot fire on a genuine pass.
      - name: Report review outcome
        if: steps.review.outcome == 'failure'
        run: |
          echo "::warning title=Dependency review::The dependency review step did not pass. Either this diff adds a dependency with a high-severity advisory, or the Dependency Review API is unavailable for this repository (private without Advanced Security). Open the step log — the two look nothing alike there — before merging."
          {
            echo "### Dependency review did not pass"
            echo ""
            echo "Advisory lane: it does not block the merge."
            echo "Read the step log to tell an advisory finding from a 403 on the Dependency Review API."
          } >> "$GITHUB_STEP_SUMMARY"

  # One stable context name to require, whatever the matrix does.
  #
  # The jobs above name themselves per leg (`check (floor, node 22.22.2)`, `check (windows-1,
  # node 24)`), so a required-status rule written against them binds context names that rotate
  # the moment the matrix changes — as they did when the windows leg became two shards.
  # `needs.check.result` is the whole matrix's result, so both shards must pass for it to read
  # `success`.
  # This job's name does not move. It fails when anything it needs failed OR was cancelled —
  # `needs` alone treats a cancelled dependency as "did not succeed" and would otherwise let a
  # skipped aggregator read as green.
  #
  # `dependency-review` is deliberately NOT in `needs`: it is advisory, and it does not run at
  # all outside a pull request, so requiring it would make every push wait on a job that will
  # never report. `apm-install` IS required, and can be: it runs on every trigger this workflow
  # declares, so requiring it makes no push wait on a job that never reports. `plugin-route` is
  # required on the same terms and for the same reason as `apm-install`: it runs on every trigger,
  # and what it gates is a ROUTE — the four plugin roots' structure — that no byte-diff in `check`
  # can see. Its credential-bound legs are the ones it leaves SKIPPED, so requiring it never makes
  # the merge path depend on a secret this repository does not hold.
  #
  # The lane split divides the heavy three from `lanes`, and the split is ASSERTED here in both
  # directions rather than inferred from which results happen to be green. `changes` must have
  # succeeded, or neither side's answer means anything. When it said `full=false`, `lanes` must
  # have passed AND the three heavy lanes must read `skipped` — so a green here always says which
  # side proved the change. Otherwise the three must have passed and `lanes` must read `skipped`,
  # so a mis-wired condition that ran the short lane on a code change goes red.
  #
  # The proven push is the third legal shape, asserted first: `prove-pr` succeeded with
  # `proven=true`, and `check`, `apm-install`, `plugin-route` and `lanes` all read `skipped`. On
  # any other answer `prove-pr` must have been skipped (every event but a push to `main`) or have
  # succeeded with `proven` not `true`, and one of the two shapes above must hold. So a failed or
  # cancelled reader is red, and a `true` beside a skipped reader is red.
  all-ci-checks:
    name: all-ci-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    if: always()
    needs: [changes, prove-pr, check, lanes, supply-chain, apm-install, plugin-route]
    steps:
      - name: Report
        run: |
          echo "changes=${{ needs.changes.result }} full=${{ needs.changes.outputs.full }} prove-pr=${{ needs.prove-pr.result }} proven=${{ needs.prove-pr.outputs.proven }} check=${{ needs.check.result }} lanes=${{ needs.lanes.result }} supply-chain=${{ needs.supply-chain.result }} apm-install=${{ needs.apm-install.result }} plugin-route=${{ needs.plugin-route.result }}"
          # The advisory lane is non-blocking by design: it is reported, never required.
          test "${{ needs.changes.result }}" = "success"
          if [ "${{ needs.prove-pr.result }}" = "success" ] && [ "${{ needs.prove-pr.outputs.proven }}" = "true" ]; then
            test "${{ needs.check.result }}" = "skipped"
            test "${{ needs.apm-install.result }}" = "skipped"
            test "${{ needs.plugin-route.result }}" = "skipped"
            test "${{ needs.lanes.result }}" = "skipped"
          else
            test "${{ needs.prove-pr.result }}" = "skipped" || test "${{ needs.prove-pr.result }}" = "success"
            test "${{ needs.prove-pr.outputs.proven }}" != "true"
            if [ "${{ needs.changes.outputs.full }}" = "false" ]; then
              test "${{ needs.lanes.result }}" = "success"
              test "${{ needs.check.result }}" = "skipped"
              test "${{ needs.apm-install.result }}" = "skipped"
              test "${{ needs.plugin-route.result }}" = "skipped"
            else
              test "${{ needs.check.result }}" = "success"
              test "${{ needs.apm-install.result }}" = "success"
              test "${{ needs.plugin-route.result }}" = "success"
              test "${{ needs.lanes.result }}" = "skipped"
            fi
          fi
