# Nightly — the lanes that are worth running daily and are not worth blocking a merge on.
#
# Nothing in this file is merge-blocking. It has no aggregator and no job here is named in a
# required status context: the point of the split is that `main` stays mergeable when a macOS
# runner image changes under us or a Node release lands with a breaking change in a dependency.
# What this file buys is EARLY NOTICE — the failure shows up in the nightly run list a day or a
# week before it would have shown up in a release.
#
# Actions are pinned to full commit SHAs with a trailing comment naming the EXACT version the SHA
# resolves to. Pins resolved 2026-08-26 with:
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
#
# Drift-guarded together with the other workflow files by test/ci/workflow.test.ts.

name: Nightly

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS is where a maintainer develops and where no merge-blocking leg runs. Demoted from the
  # per-commit matrix rather than dropped: the failure mode it catches (a case-insensitive
  # filesystem, a different `tmpdir` shape, BSD userland) is real but rare enough that paying for
  # it on every push is the wrong trade.
  macos-smoke:
    name: macos smoke (node 24)
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Dogfood check
        run: node dist/cli.js check

      - name: Leak gate
        run: npm run gate

  # The next Node line, ahead of the day it becomes the one users are on. A failure here is a
  # heads-up about a deprecation or a changed runtime default, not a defect in the change that
  # happened to run last — which is exactly why it does not gate a merge.
  node-next:
    name: node next (26)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # The end-to-end journey a user actually takes, run against the PACKED artifact in a repository
  # that is not this one: pack, install the tarball, `init` for all four clients, `check` the tree
  # it wrote, and assert the residue each client needs is on disk. `tarball-smoke` in ci.yml runs
  # the same shape for ONE client set on the floor leg; this lane widens it to all four, which is
  # the combination most likely to surface a per-adapter emission gap.
  #
  # The second half of this lane is the plugin route's INVOCATION legs, and it is ARMED PER CLIENT:
  # driving a real headless client over the plugin distribution needs that vendor's credential, and
  # this repository holds none of the four. The credential check below exits 0 with one notice per
  # absent secret, so the lane is honest about which legs ran — three configured and one missing is
  # three legs driven and one that says why it was not. The credential-free half of the same route
  # (structure, and each client's install where its CLI installs) is merge-blocking on every commit
  # in the `plugin-route` job of .github/workflows/ci.yml; what cannot be there is exactly what is
  # here. Driving is still not SCORING: the eval harness named in ci.yml's lane map is absent.
  headless-lane:
    name: headless lane (scratch-repo dogfood; invocation legs behind per-client secrets)
    runs-on: ubuntu-latest
    # 45, raised from the 25 this job carried while its second half printed a warning. The added
    # work is a distribution build measured at ~20 s on 2026-09-20 (`time node
    # scripts/build-plugin-distribution.mjs …` on darwin 25.6.0, 18.3 s, plus ~1 s for the pack and
    # the runtime build), four network-bound CLI installs, and four HEADLESS MODEL INVOCATIONS
    # whose per-leg cost nobody here has measured — a model turn is the one step in this file whose
    # duration is not a property of this repository. Nothing in this file is merge-blocking, so a
    # generous ceiling costs a nightly minute and a tight one costs a false red; re-derive from the
    # first ten runs that actually had a credential.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Pack -> install -> init -> check -> assert, in a throwaway tree. `--ignore-scripts` is
      # passed explicitly because npm reads project config from the CWD's `.npmrc` and the
      # throwaway project has none, so this repository's `ignore-scripts=true` does not reach it.
      - name: Scratch-repo dogfood (all four clients)
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          npm pack --pack-destination "$WORK"
          TARBALL="$(ls -1 "$WORK"/*.tgz | head -1)"
          echo "Packed: $TARBALL"

          CONSUMER="$WORK/consumer"
          mkdir -p "$CONSUMER"
          printf '{"name":"consumer","private":true,"version":"0.0.0"}\n' > "$CONSUMER/package.json"
          ( cd "$CONSUMER" && npm install --no-audit --no-fund --ignore-scripts "$TARBALL" )

          CLI="$CONSUMER/node_modules/.bin/stamity"
          test -x "$CLI" || { echo "::error::the installed package exposes no stamity bin"; exit 1; }

          TARGET="$WORK/target"
          mkdir -p "$TARGET"
          printf '{"name":"target","private":true,"version":"0.0.0"}\n' > "$TARGET/package.json"
          cd "$TARGET"
          "$CLI" init -y --tools claude,cursor,copilot,codex
          "$CLI" check

          # One marker per client plus the two portable artifacts. A client that emitted nothing
          # is the failure this lane exists to catch, and `check` alone would not catch it: it
          # verifies what the manifest SAYS was emitted against disk, so a client missing from
          # both is self-consistent.
          missing=""
          for path in \
            AGENTS.md \
            .stamity/manifest.json \
            CLAUDE.md \
            .claude/settings.json \
            .cursor/rules \
            .cursor/hooks.json \
            .github/instructions \
            .github/agents \
            .codex/config.toml \
            .codex/agents
          do
            [ -e "$path" ] || missing="$missing $path"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Emitted residue missing::the four-client init produced no:$missing"
            exit 1
          fi
          echo "Scratch-repo dogfood: init + check + residue present for claude, cursor, copilot, codex"

      # ── the invocation legs ────────────────────────────────────────────────
      #
      # Ordered AND addressed for credential isolation; both halves are the mechanism.
      #
      # Ordering: everything that runs third-party code runs FIRST, in steps that hold no secret at
      # all, and the credentials only enter the job after that code has finished. A step placed
      # before `creds` cannot read a credential whatever its `env:` says, which is a stronger
      # property than auditing an `env:` block: it survives someone adding a line to one of these
      # steps later.
      #
      # Addressing closes what ordering alone left open (prove/220). An installer that ran
      # secret-free could still leave a BINARY behind for a credential step to pick up: three
      # `npm install -g` lines wrote into the toolcache's bin directory — the one `node` itself
      # lives in, on PATH for every later step — and ran vendor lifecycle scripts on the way,
      # because npm reads `ignore-scripts=true` from the project `.npmrc` in local mode only; and
      # the Cursor installer writes `$HOME/.local/bin`, which this file then prepended to PATH.
      # A credential step resolving `node` or its client from PATH ran whatever had landed there.
      # So now: the interpreter's path is captured BEFORE any install; each npm-published CLI is
      # installed under its own `$RUNNER_TEMP/<vendor>` prefix with `--ignore-scripts`; nothing
      # is appended to `GITHUB_PATH`; the export step reads each binary at the absolute path its
      # installer owns; and every credential step invokes `node` and the client by those absolute
      # paths, under a PATH rebuilt from the captured interpreter directory and the image's system
      # directories — never `$HOME/.local/bin`, which the ubuntu image carries on its default
      # PATH and which the Cursor installer writes into.
      #
      # What that still does not close, stated rather than implied: the Cursor installer is a
      # vendor script piped to bash, running as the runner user, so it can write wherever that
      # user can. What the credential steps guarantee is that nothing it wrote is RESOLVED there.
      #
      # Lifecycle scripts, checked with `npm view <package> scripts` on 2026-09-22:
      # `@anthropic-ai/claude-code` declares `postinstall: node install.cjs`, which copies the
      # platform binary out of its optional dependency over the `bin/claude.exe` placeholder.
      # With scripts ignored, `claude --version` exits 1 "claude native binary not installed"
      # (measured); running that one file explicitly afterwards makes it answer `2.1.278`. So
      # the one lifecycle script the CLI needs is run by name, in this secret-free step, and no
      # other. `@github/copilot` and `@openai/codex` declare none, and both answer `--version`
      # with scripts ignored (1.0.87 and 0.155.1, measured the same day).
      #
      # The shape this replaced put all four secrets in one step whose body then ran three
      # `npm install -g` lines and piped a vendor installer to bash. Nothing was measured to be
      # compromised; the exposure was the point.
      #
      # Two costs, both accepted rather than hidden. The build and the installs run on every
      # nightly, including the ones with no credential configured — that is this repository's own
      # state today, so most nights pay for a distribution and four CLIs nobody drives. It buys
      # something real in exchange: a vendor installer that breaks is reported nightly rather than
      # on the first night someone adds a secret.
      - name: Capture the interpreter before any vendor install
        run: |
          set -euo pipefail
          NODE_BIN="$(command -v node)"
          echo "STAMITY_NODE_BIN=$NODE_BIN" >> "$GITHUB_ENV"
          echo "STAMITY_NODE_BIN=$NODE_BIN"

      - name: Build the plugin distribution
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          npm pack --pack-destination "$WORK"
          TARBALL="$(ls -1 "$WORK"/*.tgz | head -1)"
          test -f "$TARBALL"
          # The same three lines as the release and as ci.yml's plugin-route job. Duplicated rather
          # than shared: a composite action is the only way two workflows share steps, and one
          # would add a file to this directory for three lines.
          node scripts/build-plugin-runtime.mjs --tarball "$TARBALL" --out dist/plugin-runtime
          node scripts/build-plugin-distribution.mjs \
            --out dist/plugins \
            --runtime dist/plugin-runtime \
            --source-commit "$GITHUB_SHA" \
            --source-commit-date "$(git show -s --format=%cI "$GITHUB_SHA")"

      # The step that executes other people's code, and it holds nothing. Best-effort per client,
      # for the reason ci.yml's plugin-route job states: an npm outage is a fact about the day
      # rather than about the tree, and a client whose CLI did not install has its legs recorded
      # SKIPPED by the smoke, which is honest. Each install lands under its own prefix and nothing
      # here touches PATH — see the block comment above.
      - name: Install the client CLIs
        run: |
          set -euo pipefail
          npm install -g --prefix "$RUNNER_TEMP/claude" --ignore-scripts @anthropic-ai/claude-code \
            && "$STAMITY_NODE_BIN" "$RUNNER_TEMP/claude/lib/node_modules/@anthropic-ai/claude-code/install.cjs" \
            || echo "::notice title=Claude Code CLI not installed::The claude legs will record SKIPPED."
          npm install -g --prefix "$RUNNER_TEMP/copilot" --ignore-scripts @github/copilot || echo "::notice title=Copilot CLI not installed::The copilot legs will record SKIPPED."
          npm install -g --prefix "$RUNNER_TEMP/codex" --ignore-scripts @openai/codex || echo "::notice title=Codex CLI not installed::The codex legs will record SKIPPED."
          # The vendor's shell installer is the only supported route for this CLI — it publishes no
          # first-party npm package (registry queried 2026-09-20). It lands `agent` in
          # $HOME/.local/bin; the export step reads it there by absolute path.
          curl -fsS https://cursor.com/install | bash || echo "::notice title=Cursor agent CLI not installed::The cursor legs will record SKIPPED."

      # Each binary at the absolute path its installer owns, never `command -v`: a lookup on PATH
      # is exactly the resolution the block comment above closes. An install that reported success
      # and left no executable at its path is the same SKIPPED leg as one that failed. Also
      # secret-free, and also before `creds`.
      - name: Export the client binaries
        run: |
          set -euo pipefail
          for pair in \
            "CLAUDE claude $RUNNER_TEMP/claude/bin/claude" \
            "CURSOR agent $HOME/.local/bin/agent" \
            "COPILOT copilot $RUNNER_TEMP/copilot/bin/copilot" \
            "CODEX codex $RUNNER_TEMP/codex/bin/codex"
          do
            IFS=' ' read -r name bin path <<< "$pair"
            if [ -x "$path" ]; then
              echo "STAMITY_${name}_BIN=$path" >> "$GITHUB_ENV"
              echo "STAMITY_${name}_BIN=$path"
            else
              echo "::notice title=Client binary absent (${bin})::No executable at ${path} after the install step, so STAMITY_${name}_BIN is unset and every binary-bound leg of that client records SKIPPED."
            fi
          done

      # Armed per client. Each secret is read into an env var rather than compared inside an `if:`
      # expression, so an absent one produces a NOTICE a reader can find instead of a silently
      # skipped step that looks the same as a step that passed — and the absent case is per client
      # now, not per lane: three configured credentials and one missing is three invocation legs
      # that ran and one that says why it did not.
      #
      # This is the FIRST step in the job to hold a credential, and it holds all four only to answer
      # "which of you exist"; it never spawns a vendor binary. Each per-client step below then
      # carries exactly one.
      #
      # Which variable each client honours headlessly was measured from the binaries themselves on
      # 2026-09-20, not read off a page, and each mapping below carries its measurement. Only the
      # SECRET names are this repository's choice; the env-var names are the vendors'.
      - name: Headless drive credentials
        id: creds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
        run: |
          set -euo pipefail
          clients=""
          # The secret's VALUE is never passed as an argument or echoed: the loop resolves the
          # variable by NAME through bash indirect expansion and only ever asks whether it is empty.
          for pair in \
            "claude ANTHROPIC_API_KEY" \
            "cursor CURSOR_API_KEY" \
            "copilot COPILOT_GITHUB_TOKEN" \
            "codex CODEX_API_KEY"
          do
            client="${pair% *}"
            var="${pair#* }"
            if [ -n "${!var:-}" ]; then
              clients="${clients:+$clients,}$client"
            else
              echo "::notice title=Invocation leg skipped (${client})::No ${var} secret is configured for this repository, so the ${client} invocation leg of the plugin-route smoke did not run. Its structure and install legs run credential-free in the plugin-route job of .github/workflows/ci.yml on every commit."
            fi
          done
          if [ -z "$clients" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Headless drive skipped::No client credential secret is configured for this repository, so the headless target-tool drive did not run. The scratch-repo dogfood above DID run and is the coverage this lane currently provides."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "clients=$clients" >> "$GITHUB_OUTPUT"
          echo "Invocation legs armed for: $clients"

      # One step per client, each holding exactly ONE credential. That is the fix: a compromised
      # release of any one vendor's CLI now runs in a process whose environment carries that
      # vendor's own key and nothing else, so the blast radius of a bad `@github/copilot` is the
      # Copilot token rather than all four.
      #
      # The guard is `contains()` over the armed csv rather than a per-client output, because the
      # four names are mutually non-prefixing — claude, cursor, copilot, codex share no
      # substring relationship — so a containment test cannot arm the wrong client. The workflow
      # test evaluates all four guards against every armed combination rather than trusting that.
      #
      # `!cancelled() &&` ahead of it (prove/223): a bare `contains()` carries the implicit
      # `success()`, so one client's FAIL skipped every client after it and a red nightly reported
      # one leg instead of four. `!cancelled()` rather than `always()` because a cancelled run —
      # this workflow cancels in-progress runs on re-dispatch — must not go on spending model calls.
      # The job's verdict is then the step at the end, which reads every drive step's outcome.
      #
      # A FAIL here is a red nightly, which is this lane's purpose: the invocation legs are the half
      # of the route a merge gate cannot hold, because they need an account. `set -o pipefail` is
      # what carries the smoke's exit status through the `tee`. `node` and the client are invoked
      # by the absolute paths captured before the installs — the block comment above the build step.
      - name: Headless target-tool drive (claude)
        id: drive-claude
        if: "!cancelled() && contains(steps.creds.outputs.clients, 'claude')"
        env:
          # `claude --help` on 2.1.278 (read 2026-09-20): Anthropic auth is "strictly
          # ANTHROPIC_API_KEY or apiKeyHelper".
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          # PATH rebuilt from the interpreter directory captured before any install plus the
          # image's system directories: nothing a vendor installer wrote is resolvable here.
          export PATH="$(dirname "$STAMITY_NODE_BIN"):/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          LOG="$RUNNER_TEMP/plugin-route-claude.log"
          "$STAMITY_NODE_BIN" scripts/plugin-route-smoke.mjs --dist dist/plugins --client claude --invoke \
            --json "$RUNNER_TEMP/plugin-route-claude.json" | tee "$LOG"
          {
            echo "### Plugin route: invocation legs (claude)"
            echo ""
            echo '```'
            grep '^plugin-route: ' "$LOG" || echo "(the smoke printed no result line)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Headless target-tool drive (cursor)
        id: drive-cursor
        if: "!cancelled() && contains(steps.creds.outputs.clients, 'cursor')"
        env:
          # `agent --help` on 2026.09.15-d2fe57e (read 2026-09-20): `--api-key <key>` "can also use
          # CURSOR_API_KEY env var".
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          # PATH rebuilt from the interpreter directory captured before any install plus the
          # image's system directories: nothing a vendor installer wrote is resolvable here.
          export PATH="$(dirname "$STAMITY_NODE_BIN"):/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          LOG="$RUNNER_TEMP/plugin-route-cursor.log"
          "$STAMITY_NODE_BIN" scripts/plugin-route-smoke.mjs --dist dist/plugins --client cursor --invoke \
            --json "$RUNNER_TEMP/plugin-route-cursor.json" | tee "$LOG"
          {
            echo "### Plugin route: invocation legs (cursor)"
            echo ""
            echo '```'
            grep '^plugin-route: ' "$LOG" || echo "(the smoke printed no result line)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Headless target-tool drive (copilot)
        id: drive-copilot
        if: "!cancelled() && contains(steps.creds.outputs.clients, 'copilot')"
        env:
          # `copilot help environment` on 1.0.85 (read 2026-09-20) lists COPILOT_GITHUB_TOKEN,
          # GH_TOKEN, GITHUB_TOKEN in that order of precedence. The first is set because it is the
          # only one of the three that means Copilot and nothing else, so it cannot collide with a
          # token another step wants.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # PATH rebuilt from the interpreter directory captured before any install plus the
          # image's system directories: nothing a vendor installer wrote is resolvable here.
          export PATH="$(dirname "$STAMITY_NODE_BIN"):/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          LOG="$RUNNER_TEMP/plugin-route-copilot.log"
          "$STAMITY_NODE_BIN" scripts/plugin-route-smoke.mjs --dist dist/plugins --client copilot --invoke \
            --json "$RUNNER_TEMP/plugin-route-copilot.json" | tee "$LOG"
          {
            echo "### Plugin route: invocation legs (copilot)"
            echo ""
            echo '```'
            grep '^plugin-route: ' "$LOG" || echo "(the smoke printed no result line)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Headless target-tool drive (codex)
        id: drive-codex
        if: "!cancelled() && contains(steps.creds.outputs.clients, 'codex')"
        env:
          # `codex login --help` on codex-cli 0.154.0 (read 2026-09-20) names the variable in its
          # own example — `printenv OPENAI_API_KEY | codex login --with-api-key`. Note the LIMIT
          # that example states: the measured mechanism is a login that reads the key from stdin,
          # and whether `codex exec` honours the bare variable is unmeasured. So this leg may record
          # a credential failure even with the secret set, and the smoke is where a login step would
          # belong if one is needed.
          OPENAI_API_KEY: ${{ secrets.CODEX_API_KEY }}
        run: |
          set -euo pipefail
          # PATH rebuilt from the interpreter directory captured before any install plus the
          # image's system directories: nothing a vendor installer wrote is resolvable here.
          export PATH="$(dirname "$STAMITY_NODE_BIN"):/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          LOG="$RUNNER_TEMP/plugin-route-codex.log"
          "$STAMITY_NODE_BIN" scripts/plugin-route-smoke.mjs --dist dist/plugins --client codex --invoke \
            --json "$RUNNER_TEMP/plugin-route-codex.json" | tee "$LOG"
          {
            echo "### Plugin route: invocation legs (codex)"
            echo ""
            echo '```'
            grep '^plugin-route: ' "$LOG" || echo "(the smoke printed no result line)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The four `--json` documents, kept (prove/225): per leg they carry the command, the exit
      # code, the client version and the transcript hash — what a run record cites — and
      # RUNNER_TEMP is gone with the job. `always()` on the arming switch, because the run whose
      # leg FAILED is exactly the one whose document is needed. The pin is the sha every other
      # workflow here uses for this action; short retention, since the nightly repeats.
      - name: Keep the invocation-leg documents
        if: always() && steps.creds.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-route-invocation-legs
          path: ${{ runner.temp }}/plugin-route-*.json
          if-no-files-found: warn
          retention-days: 14

      # One verdict over the four drive steps. Each of them runs whether or not its siblings
      # failed, so the job's status is decided here: any drive step whose outcome is a failure
      # fails the job, and the notice names which. Holds no credential — it reads outcomes.
      - name: Headless drive verdict
        if: always() && steps.creds.outputs.enabled == 'true'
        env:
          OUTCOMES: >-
            claude=${{ steps.drive-claude.outcome }}
            cursor=${{ steps.drive-cursor.outcome }}
            copilot=${{ steps.drive-copilot.outcome }}
            codex=${{ steps.drive-codex.outcome }}
        run: |
          set -euo pipefail
          echo "Drive outcomes: $OUTCOMES"
          failed=""
          for pair in $OUTCOMES; do
            case "${pair#*=}" in
              failure|cancelled) failed="${failed:+$failed,}${pair%%=*}" ;;
            esac
          done
          if [ -n "$failed" ]; then
            echo "::error title=Headless drive failed::The invocation legs failed for: $failed. Each client's own step above carries its result lines, and the --json documents are in the plugin-route-invocation-legs artifact."
            exit 1
          fi
          echo "No armed drive step failed"

      # Said once, after the legs, and said even when a leg failed — `always()` on the arming
      # condition, because a run that measured nothing is exactly the run whose summary must not
      # read as a measurement. Driving a client is not SCORING a run: the eval harness named in
      # ci.yml's lane map — the instrument behind the `obsolete_when` triggers, the per-unit size
      # defaults and the headline quality metric — does not exist, and nothing above measures any
      # of the three.
      - name: Headless drive summary
        if: always() && steps.creds.outputs.enabled == 'true'
        env:
          CLIENTS: ${{ steps.creds.outputs.clients }}
        run: |
          set -euo pipefail
          {
            echo "### Plugin route: what the invocation legs did not measure"
            echo ""
            echo "Clients driven: \`$CLIENTS\`"
            echo ""
            echo "Scoring is NOT part of this: the eval harness named in .github/workflows/ci.yml does not exist, and nothing here measures the three items that read as calibrated against it."
          } >> "$GITHUB_STEP_SUMMARY"
