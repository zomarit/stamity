# Fork release — a fork's own release path: its CLI, from one tag. Since 1.15.0 it publishes the
# npm package and its GitHub release only: the plugin distribution and the APM refs it also
# published were deleted with those routes.
#
# INERT UNTIL ARMED. This workflow runs in every copy of this repository, the canonical one
# included, and does nothing in any of them until the fork names its destination. The `probe` job
# reads three repository variables — STAMITY_FORK_RELEASE, which must equal this repository's own
# `<owner>/<repo>`; STAMITY_RELEASE_REGISTRY, the npm registry's https URL; and the optional
# STAMITY_RELEASE_BRANCH, the release branch a tag must be reachable from (default `main`). Until
# the first one names this repository, the run ends GREEN with a notice and every later job is
# skipped. The destinations live in variables rather than in a checked-in file so they never land
# in files the upstream lane merges, and so a copy of this file is inert wherever it goes.
#
# THE CANONICAL REPOSITORY RELEASES THROUGH release.yml, AND ONLY THERE. That file stays
# canonical-only; this one refuses the canonical repository in its probe and again inside its
# publish job, whatever the variables say.
#
# THE TRUST SPLIT. `probe` and `gates` hold no secret: `gates` runs the fork's whole ladder — its
# install, build, suite, leak gate and tarball smoke, all third-party code — with `contents: read`
# and nothing else. `publish` checks out nothing. It runs npm, git and the GitHub CLI only over
# the artifact `gates` uploaded, and only after it has verified every digest in it against the
# `gates` job's outputs, a channel separate from the artifact itself.
#
# HOW A RELEASE IS PROVED. By checksums and the registry's own authentication: the tarball's
# SHA-256, the company's registry login and its own git.
# There is no npm provenance, because npm provenance needs a public source repository. There are
# no attestations: GitHub's build attestations need GitHub Enterprise Cloud for a private
# repository, and the maintainer's decision of 2026-09-24 leaves them unbuilt until a company
# asks for them.
#
# NO CHANGELOG SECTION IS REQUIRED. A fork's suffixed versions (`1.10.0-acme.1`) have no section
# in the canonical CHANGELOG.md, so the release body is a fixed paragraph and the checksum files.
#
# NO EGRESS ALLOWLIST. release.yml pins its network because every host it needs is known when it
# is written. This file's most important destination is the fork's registry, a variable this
# repository never sees, so a static allowlist would either block every fork or be widened to
# meaninglessness. The compensating control is the trust split above, as in upstream-update.yml:
# the jobs that reach the network with third-party code hold nothing worth stealing.
#
# THE DISPATCH. `workflow_dispatch` takes a `dry_run` input that DEFAULTS TO TRUE: a dispatch that
# leaves it alone runs every gate, builds every artifact and prints what it would have published.
# A real run comes from a `v*` tag push, or from a dispatch made from that tag with `dry_run` set
# to false, and either way `gates` proves the tag, its version and its ancestry first.
#
# THE REGISTRY REHEARSAL. A fork's suffixed version (`1.10.0-acme.1`) is a prerelease, and npm 11
# refuses to publish a prerelease without `--tag`. So the publish names one dist-tag, DIST_TAG,
# set once below to `latest`, the tag the CLI's update notice reads. And on every armed run, a tag
# push included, `gates` runs the same publish with `--dry-run` right after it packs the tarball,
# with no secret and `contents: read`, so npm's refusal fails the run before the approval rather
# than inside it. A dry run uploads nothing. A registry that refuses a dry run for want of a token
# never reaches the tag rule, so that one answer passes with a warning saying so. The fork's runner stays on `ubuntu-latest`: this file
# has no egress allowlist for a new image to break (see above).
#
# Actions are pinned to the same full commit SHAs release.yml pins, with the same version comments.
#
# Drift-guarded by test/ci/forkReleaseWorkflow.test.ts (this file's own properties) and by
# test/ci/workflow.test.ts (the gates every workflow in this directory meets).

name: Fork release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every gate and build every artifact without publishing'
        type: boolean
        default: true

permissions:
  contents: read

# The one npm dist-tag a release publishes under, read by the gates rehearsal, the publish and
# the rehearsal report alike.
env:
  DIST_TAG: latest

concurrency:
  group: fork-release-${{ github.ref }}
  # Never cancel a release in flight: a registry publish is not reversible on a whim.
  cancel-in-progress: false

jobs:
  # ── Job 1: the probe. Decides whether this repository is a fork that armed the workflow. ──
  #
  # An unarmed repository is a NOTICE and a green exit, not a failure: a run that ends green with a
  # visible reason is legible, and a workflow that fails in every copy that never used it is a
  # workflow nobody keeps. A fork that DID arm it with a registry it cannot use is an error, and
  # the error names the variable and never prints its value.
  probe:
    name: probe the release destination
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      armed: ${{ steps.arm.outputs.armed }}
      branch: ${{ steps.arm.outputs.branch }}
      # The registry this run validated, read ONCE: gates proves publishConfig.registry against it
      # and publish sends the tarball and the credential to it, so a variable edited while the run
      # waits for approval cannot split the proved destination from the used one.
      registry: ${{ steps.arm.outputs.registry }}
    steps:
      - name: Read the release destination
        id: arm
        env:
          ARM: ${{ vars.STAMITY_FORK_RELEASE }}
          REGISTRY: ${{ vars.STAMITY_RELEASE_REGISTRY }}
          BRANCH: ${{ vars.STAMITY_RELEASE_BRANCH }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # GitHub's repository names are case-insensitive, so both sides are folded first.
          ARM_KEY="$(printf '%s' "${ARM:-}" | tr '[:upper:]' '[:lower:]')"
          REPO_KEY="$(printf '%s' "${REPO:-}" | tr '[:upper:]' '[:lower:]')"

          if [ "$REPO_KEY" = 'zomarit/stamity' ]; then
            {
              echo 'armed=false'
              echo 'branch=main'
            } >> "$GITHUB_OUTPUT"
            echo "::notice title=Fork release skipped::This is the canonical repository, which releases through .github/workflows/release.yml. This workflow releases forks only."
            exit 0
          fi

          if [ -z "$ARM_KEY" ] || [ "$ARM_KEY" != "$REPO_KEY" ]; then
            {
              echo 'armed=false'
              echo 'branch=main'
            } >> "$GITHUB_OUTPUT"
            echo "::notice title=Fork release not armed::Nothing was released. To arm this workflow, set the repository variable STAMITY_FORK_RELEASE to $REPO and STAMITY_RELEASE_REGISTRY to your registry's https URL; see docs/enterprise-forks.md."
            exit 0
          fi

          # An https URL with a host, and no userinfo, query or fragment: the clean-URL rule a
          # registry value is held to, stated in shell. The value is never printed,
          # because the shape this refusal exists for is a URL with a password in it.
          REGISTRY_OK=true
          case "${REGISTRY:-}" in
            https://*) ;;
            *) REGISTRY_OK=false ;;
          esac
          AUTHORITY="${REGISTRY:-}"
          AUTHORITY="${AUTHORITY#https://}"
          AUTHORITY="${AUTHORITY%%/*}"
          if ! [[ "$AUTHORITY" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?(:[0-9]+)?$ ]]; then
            REGISTRY_OK=false
          fi
          case "${REGISTRY:-}" in
            *\?*|*\#*|*[[:space:]]*) REGISTRY_OK=false ;;
          esac
          if [ "$REGISTRY_OK" != 'true' ]; then
            echo "::error title=Fork release misconfigured::STAMITY_RELEASE_REGISTRY must be an https URL with a host and no userinfo, query or fragment. Its value is not printed."
            exit 1
          fi

          if [ -n "${BRANCH:-}" ]; then
            BRANCH_OK=true
            case "$BRANCH" in
              -*) BRANCH_OK=false ;;
            esac
            if ! git check-ref-format "refs/heads/$BRANCH" >/dev/null 2>&1; then
              BRANCH_OK=false
            fi
            if [ "$BRANCH_OK" != 'true' ]; then
              echo "::error title=Fork release misconfigured::STAMITY_RELEASE_BRANCH is not a valid branch name. Unset it to use main, or name the branch your release tags are cut from."
              exit 1
            fi
          fi

          {
            echo 'armed=true'
            echo "branch=${BRANCH:-main}"
            echo "registry=$REGISTRY"
          } >> "$GITHUB_OUTPUT"
          echo "Fork release armed for $REPO; release branch: ${BRANCH:-main}"

  # ── Job 2: gates, pack and build. Runs the fork's code. Holds no secret. ──
  gates:
    name: gates and pack
    needs: probe
    if: needs.probe.outputs.armed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.prove.outputs.version }}
      package_name: ${{ steps.prove.outputs.package_name }}
      tarball: ${{ steps.pack.outputs.tarball }}
      tarball_sha256: ${{ steps.pack.outputs.tarball_sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the ancestry proof reads the release branch's remote-tracking ref.
          fetch-depth: 0

      # No `cache: npm`: an Actions cache is writable from any branch, and this job packs the
      # bytes that ship. No `registry-url` either: this job installs from the lockfile and
      # publishes nothing.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # The proofs, answered before anything is built. Two kinds:
      #   the ref, on every run that can publish (a tag push, or a dispatch with dry_run false):
      #     the ref is the tag `v<package.json version>`, and its commit is reachable from the
      #     release branch;
      #   the identity, on every run: the package is not the canonical one, is not private, and
      #     names the armed registry in publishConfig.registry — and on GitHub Packages, its scope
      #     is this repository's owner.
      # A fork can still hold the canonical `v*` tags (a public fork, or a copy imported with the
      # earlier mirror recipe), and a push of one of them lands here: its commit carries the
      # canonical name, so it fails the identity proof.
      # A rehearsal skips the ref proofs, because it publishes nothing and has to stay runnable
      # from a branch, and says which ones it skipped.
      - name: Prove the fork release
        id: prove
        env:
          REGISTRY: ${{ needs.probe.outputs.registry }}
          BRANCH: ${{ needs.probe.outputs.branch }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          PKG_PRIVATE="$(node -p "String(require('./package.json').private)")"
          PKG_REGISTRY="$(node -p "String((require('./package.json').publishConfig ?? {}).registry ?? '')")"
          TARGET="${BRANCH:-main}"
          DRY_RUN="$(printf '%s' "${DRY_RUN_INPUT:-}" | tr '[:upper:]' '[:lower:]')"

          REQUIRE_REF_PROOFS=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            REQUIRE_REF_PROOFS=true
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" = "false" ]; then
            REQUIRE_REF_PROOFS=true
          fi

          FAILED=0
          fail() {
            echo "::error title=Fork release proof failed::$1"
            FAILED=1
          }

          if [ "$REQUIRE_REF_PROOFS" = "true" ]; then
            if [ "$GITHUB_REF" != "refs/tags/v$PKG_VERSION" ]; then
              fail "This run is on $GITHUB_REF, and a fork release comes from the tag v$PKG_VERSION that package.json declares."
            fi
            if ! git rev-parse --verify --quiet "refs/remotes/origin/$TARGET" >/dev/null; then
              fail "refs/remotes/origin/$TARGET is not present, so the tag's ancestry cannot be proved. Set STAMITY_RELEASE_BRANCH to the branch your release tags are cut from."
            elif ! git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$TARGET"; then
              fail "The tagged commit $GITHUB_SHA is not reachable from origin/$TARGET."
            fi
          else
            echo "::notice title=Fork release rehearsal::Nothing is published, so the ref proofs were SKIPPED: (1) the ref is the tag v$PKG_VERSION; (2) its commit is reachable from origin/$TARGET. The identity proofs still ran."
          fi

          if [ "$PKG_NAME" = '@zomarit/stamity' ]; then
            fail "package.json still names the canonical package. A fork publishes under its own scope."
          fi
          if [ "$PKG_PRIVATE" = "true" ]; then
            fail "package.json sets private: true, and npm refuses to publish a private package."
          fi
          strip_slashes() {
            local value="$1"
            while [ "${value%/}" != "$value" ]; do value="${value%/}"; done
            printf '%s' "$value"
          }
          if [ -z "${REGISTRY:-}" ] || [ "$(strip_slashes "$PKG_REGISTRY")" != "$(strip_slashes "$REGISTRY")" ]; then
            fail "package.json publishConfig.registry does not equal the STAMITY_RELEASE_REGISTRY variable."
          fi
          HOST="${REGISTRY:-}"
          HOST="${HOST#https://}"
          HOST="$(printf '%s' "${HOST%%/*}" | tr '[:upper:]' '[:lower:]')"
          if [ "$HOST" = "npm.pkg.github.com" ]; then
            case "$PKG_NAME" in
              @*/*) SCOPE="${PKG_NAME%%/*}"; SCOPE="${SCOPE#@}" ;;
              *) SCOPE="" ;;
            esac
            OWNER="$(printf '%s' "${GITHUB_REPOSITORY_OWNER:-}" | tr '[:upper:]' '[:lower:]')"
            if [ -z "$SCOPE" ] || [ "$SCOPE" != "$OWNER" ]; then
              fail "GitHub Packages publishes only @$OWNER/<name> from this repository, and package.json names $PKG_NAME."
            fi
          fi

          if [ "$FAILED" != "0" ]; then
            echo "::error title=Fork release refused::Remedy: run node scripts/fork-identity.mjs --repository <url> --registry <url>, commit the result, and tag v<version> on the release branch again."
            exit 1
          fi

          {
            echo "version=$PKG_VERSION"
            echo "package_name=$PKG_NAME"
          } >> "$GITHUB_OUTPUT"
          echo "Fork release proved: $PKG_NAME@$PKG_VERSION"

      # The canonical ladder, as release.yml runs it.
      - name: Install
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        run: npm ci

      - name: Verify lockfile is in sync
        run: git diff --exit-code package-lock.json

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Leak gate
        run: npm run gate

      - name: Dogfood check
        run: node dist/cli.js check

      - name: Tarball smoke (publish shape)
        run: node scripts/tarball-smoke.mjs

      - name: Pack tarball
        id: pack
        run: |
          set -euo pipefail
          TARBALL="$(node scripts/pack-release.mjs --pack-destination . --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s)[0].filename))')"
          test -f "$TARBALL"
          SHA="$(sha256sum "$TARBALL" | awk '{print $1}')"
          {
            echo "tarball=$TARBALL"
            echo "tarball_sha256=$SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Packed: $TARBALL ($(wc -c < "$TARBALL") bytes)"
          echo "SHA-256: $SHA"

      # The registry's own answer, before the approval: the publish job's flags, dry-run. npm 11,
      # the npm the publish job runs, refuses a prerelease without `--tag`, so an older npm here
      # would prove nothing and stops the run instead. A dry run uploads nothing, and this job
      # holds no secret. What npm does with a tokenless dry run against a registry that wants a
      # token was not measured, so the step reads npm's answer instead of assuming one: the tag
      # rule's refusal ("must specify a tag") or any other error fails the step; an authentication
      # refusal (E401, E403 or ENEEDAUTH) passes with a warning, because then the tag rule was never
      # reached and only the publish job's own `--tag` stands behind it.
      - name: Rehearse the registry publish
        env:
          REGISTRY: ${{ needs.probe.outputs.registry }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          NPM_VERSION="$(npm --version)"
          NPM_MAJOR="${NPM_VERSION%%.*}"
          case "$NPM_MAJOR" in
            ''|*[!0-9]*) NPM_MAJOR=0 ;;
          esac
          if [ "$NPM_MAJOR" -lt 11 ]; then
            echo "::error::The rehearsal needs npm 11 or newer, the npm the publish job runs, which refuses a prerelease without --tag. This runner has npm $NPM_VERSION."
            exit 1
          fi
          echo "npm $NPM_VERSION; dist-tag $DIST_TAG"
          STATUS=0
          OUT="$(npm publish "./$TARBALL" --dry-run --registry "$REGISTRY" --tag "$DIST_TAG" 2>&1)" || STATUS=$?
          printf '%s\n' "$OUT"
          case "$OUT" in
            *"must specify a tag"*)
              echo "::error::npm refused the publish for its dist-tag rule (exit $STATUS); the publish job would refuse it the same way."
              exit 1 ;;
          esac
          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi
          case "$OUT" in
            *E401*|*E403*|*ENEEDAUTH*)
              echo "::warning::The registry refused a tokenless dry run (npm exit $STATUS), so npm's dist-tag rule was not reached; only the publish job's own --tag $DIST_TAG stands behind it."
              exit 0 ;;
          esac
          echo "::error::npm refused the dry run (exit $STATUS) for a reason other than authentication; see its output above."
          exit 1

      # Seven days, so the artifact outlives the `fork-release` environment's human approval.
      - name: Upload release tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-release-dist
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 7

  # ── Job 3: publish. The only job with a credential, and it checks nothing out. ──
  #
  # Armed, and either a `v*` tag push or a dispatch that set dry_run to literally false. The
  # `format()` spelling is release.yml's, for release.yml's reason: `inputs.dry_run == false` is
  # true for an absent or empty input.
  publish:
    name: publish
    needs: [probe, gates]
    if: >-
      needs.probe.outputs.armed == 'true' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run) == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The single approval point: configure required reviewers on this environment.
    environment: fork-release
    #   contents: write  the GitHub release
    #   packages: write  a publish to GitHub Packages with the per-run token
    # No id-token: nothing here mints provenance or an attestation.
    permissions:
      contents: write
      packages: write

    steps:
      # Belt and braces on the job condition: re-derive the destination before anything else.
      - name: Refuse an unarmed destination
        env:
          ARM: ${{ vars.STAMITY_FORK_RELEASE }}
          REPO: ${{ github.repository }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ARM_KEY="$(printf '%s' "${ARM:-}" | tr '[:upper:]' '[:lower:]')"
          REPO_KEY="$(printf '%s' "${REPO:-}" | tr '[:upper:]' '[:lower:]')"
          DRY_RUN="$(printf '%s' "${DRY_RUN_INPUT:-}" | tr '[:upper:]' '[:lower:]')"
          if [ "$REPO_KEY" = 'zomarit/stamity' ]; then
            echo "::error::The canonical repository releases through .github/workflows/release.yml, and the fork publish job started anyway. Failing closed."
            exit 1
          fi
          if [ -z "$ARM_KEY" ] || [ "$ARM_KEY" != "$REPO_KEY" ]; then
            echo "::error::STAMITY_FORK_RELEASE does not name this repository, and the publish job started anyway. The job condition has drifted. Failing closed."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" != "false" ]; then
            echo "::error::This dispatch did not set dry_run to false, and the publish job started anyway. The job condition has drifted. Failing closed."
            exit 1
          fi
          echo "Publishing for $REPO"

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-release-dist

      # The verification runs before the one irreversible step, the registry publish. It is
      # release.yml's step, byte for byte, and a test holds the two equal.
      - name: Verify tarball digest
        env:
          EXPECTED_SHA: ${{ needs.gates.outputs.tarball_sha256 }}
          EXPECTED_TARBALL: ${{ needs.gates.outputs.tarball }}
        run: |
          set -euo pipefail
          TARBALL="$EXPECTED_TARBALL"
          if [ -z "$TARBALL" ] || [ ! -f "$TARBALL" ]; then
            echo "::error::The gates job packed '$EXPECTED_TARBALL' but the downloaded artifact does not carry it. Refusing to publish."
            exit 1
          fi
          ACTUAL_SHA="$(sha256sum "$TARBALL" | awk '{print $1}')"
          if [ -z "$EXPECTED_SHA" ] || [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Tarball digest mismatch: gates output '$EXPECTED_SHA' vs downloaded '$ACTUAL_SHA'. Refusing to publish."
            exit 1
          fi
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          echo "Digest verified against the gates job output: $TARBALL ($ACTUAL_SHA)"

      # npm publishes whatever name@version the tarball's OWN package.json declares, and the
      # proofs ran on the checkout's. The digest ties this tarball to the gates job, not to what
      # the proofs read, so the manifest inside it is held to the proved name, version and
      # registry before anything is published (fork-release only: release.yml publishes one
      # fixed name).
      #
      # The members are checked FIRST. npm reads a tarball's manifest by extracting it with the
      # first path component stripped, whatever that component is, and a later member overwrites
      # an earlier one: `package/package.json` followed by `other/package.json` shows `tar` the
      # first and npm the second. So every member must sit under `package/`, with no empty, `.` or
      # `..` component that could collapse onto another path, and exactly one member may be
      # `package/package.json`, a regular file.
      - name: Verify the tarball's identity
        env:
          EXPECTED_NAME: ${{ needs.gates.outputs.package_name }}
          EXPECTED_VERSION: ${{ needs.gates.outputs.version }}
          EXPECTED_REGISTRY: ${{ needs.probe.outputs.registry }}
        run: |
          set -euo pipefail
          MEMBERS_FILE="$(mktemp)"
          LISTING_FILE="$(mktemp)"
          if ! tar -tzf "$TARBALL" > "$MEMBERS_FILE" || ! tar -tvzf "$TARBALL" > "$LISTING_FILE"; then
            echo "::error::$TARBALL cannot be listed. Refusing to publish."
            exit 1
          fi
          MEMBERS_FILE="$MEMBERS_FILE" LISTING_FILE="$LISTING_FILE" node -e '
            const fs = require("node:fs");
            const lines = (path) => fs.readFileSync(path, "utf8").split("\n").filter((line) => line !== "");
            const members = lines(process.env.MEMBERS_FILE);
            let bad = 0;
            for (const member of members) {
              const parts = member.replace(/\/$/, "").split("/");
              if (parts[0] !== "package" || parts.slice(1).some((part) => part === "" || part === "." || part === "..")) {
                console.log(`::error::The tarball carries ${JSON.stringify(member)}, outside package/ or through an empty, . or .. component, and npm would read it in place of what this step checks. Refusing to publish.`);
                bad += 1;
              }
            }
            const manifests = members.filter((member) => member === "package/package.json").length;
            const regular = lines(process.env.LISTING_FILE).filter((line) => /^-.* package\/package\.json$/.test(line)).length;
            if (manifests !== 1 || regular !== 1) {
              console.log(`::error::The tarball carries ${manifests} package/package.json members, ${regular} of them a regular file, and exactly one regular file is required. Refusing to publish.`);
              bad += 1;
            }
            if (bad > 0) process.exit(1);
          '
          if ! PACKED_MANIFEST="$(tar -xzOf "$TARBALL" package/package.json)"; then
            echo "::error::$TARBALL carries no readable package/package.json. Refusing to publish."
            exit 1
          fi
          PACKED_MANIFEST="$PACKED_MANIFEST" node -e '
            const strip = (value) => String(value ?? "").replace(/\/+$/, "");
            let pkg;
            try {
              pkg = JSON.parse(process.env.PACKED_MANIFEST);
            } catch {
              console.log("::error::The package.json inside the tarball is not JSON. Refusing to publish.");
              process.exit(1);
            }
            const rows = [
              ["name", pkg.name, process.env.EXPECTED_NAME],
              ["version", pkg.version, process.env.EXPECTED_VERSION],
              ["publishConfig.registry", strip(pkg.publishConfig?.registry), strip(process.env.EXPECTED_REGISTRY)],
            ];
            let bad = 0;
            for (const [field, packed, proved] of rows) {
              if (!proved || packed !== proved) {
                console.log(`::error::The tarball declares ${field} ${JSON.stringify(packed ?? null)} and the proofs passed ${JSON.stringify(proved ?? "")}. Refusing to publish.`);
                bad += 1;
              }
            }
            if (bad > 0) process.exit(1);
            console.log(`Tarball identity verified: ${pkg.name}@${pkg.version}`);
          '

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: ${{ needs.probe.outputs.registry }}

      # The credential: the per-run token for GitHub Packages, the STAMITY_REGISTRY_TOKEN secret
      # for any other registry. The GitHub Packages arm matches the host exactly, never a prefix,
      # so a lookalike host such as `npm.pkg.github.com.example` never receives the per-run token.
      # GitHub compares strings, `startsWith` included, without regard to case, so an uppercase
      # host routes here as it does in gates, which lowercases the host before its scope check.
      #
      # Idempotent: a version already on the registry with the same integrity is skipped, and one
      # held by another tarball is refused, never overwritten. No `--provenance` (it needs a public
      # source repository) and no `--access` (the registry's own scope settings decide it).
      - name: Publish to the registry
        env:
          NODE_AUTH_TOKEN: ${{ (needs.probe.outputs.registry == 'https://npm.pkg.github.com' || startsWith(needs.probe.outputs.registry, 'https://npm.pkg.github.com/')) && secrets.GITHUB_TOKEN || secrets.STAMITY_REGISTRY_TOKEN }}
          REGISTRY: ${{ needs.probe.outputs.registry }}
          PACKAGE_NAME: ${{ needs.gates.outputs.package_name }}
          VERSION: ${{ needs.gates.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error title=No registry credential::set the STAMITY_REGISTRY_TOKEN secret, or publish to GitHub Packages."
            exit 1
          fi
          INTEGRITY="$(node -e 'const fs = require("node:fs"); const crypto = require("node:crypto"); process.stdout.write("sha512-" + crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$TARBALL")"
          existing="$(npm view "$PACKAGE_NAME@$VERSION" dist.integrity --registry "$REGISTRY" 2>/dev/null || true)"
          if [ "$existing" = "$INTEGRITY" ]; then
            echo "$PACKAGE_NAME@$VERSION is already published with this tarball's integrity; nothing to publish (an idempotent re-run)."
            exit 0
          fi
          if [ -n "$existing" ]; then
            echo "::error::$PACKAGE_NAME@$VERSION is already published from another tarball. A published version is never replaced; release a new version."
            exit 1
          fi
          npm publish "./$TARBALL" --registry "$REGISTRY" --tag "$DIST_TAG"

      # The release carries the tarball and its checksum, exactly as the gates job built and this
      # job verified it. `--verify-tag` and `--target` keep `gh` from inventing a tag on the
      # default branch's head. A re-run finds the release and uploads only the assets it is
      # missing; it replaces none.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout here, so `gh` cannot infer the repository from a remote.
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.gates.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          ASSETS="$TARBALL $TARBALL.sha256"

          if PRESENT="$(gh release view "v$VERSION" --json assets --jq '.assets[].name' 2>/dev/null)"; then
            MISSING=""
            for asset in $ASSETS; do
              if ! printf '%s\n' "$PRESENT" | grep -Fxq -- "$(basename "$asset")"; then
                MISSING="$MISSING $asset"
              fi
            done
            if [ -z "$MISSING" ]; then
              echo "v$VERSION already carries every asset; nothing to create (an idempotent re-run)."
              exit 0
            fi
            # shellcheck disable=SC2086
            gh release upload "v$VERSION" $MISSING
            echo "v$VERSION existed; uploaded the missing assets:$MISSING"
            exit 0
          fi

          # shellcheck disable=SC2086
          gh release create "v$VERSION" $ASSETS \
            --title "v$VERSION" \
            --notes "Built from $GITHUB_SHA by .github/workflows/fork-release.yml. Verify each asset with sha256sum -c <asset>.sha256. This release carries no provenance and no attestation; the registry's authentication and these checksums are its proof." \
            --target "$GITHUB_SHA" \
            --verify-tag

  # ── Job 4: the rehearsal report. Runs instead of `publish` on an armed run, never beside it. ──
  #
  # The condition is the armed complement of publish's: on an armed run exactly one of the two
  # jobs runs, whatever the trigger and the input are.
  dry-run-summary:
    name: dry run summary
    needs: [probe, gates]
    if: >-
      needs.probe.outputs.armed == 'true' &&
      !((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run) == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Report what a real run would publish
        env:
          PACKAGE_NAME: ${{ needs.gates.outputs.package_name }}
          VERSION: ${{ needs.gates.outputs.version }}
          TARBALL: ${{ needs.gates.outputs.tarball }}
          TARBALL_SHA256: ${{ needs.gates.outputs.tarball_sha256 }}
        run: |
          set -euo pipefail
          {
            echo "### Fork release dry run — nothing was published"
            echo ""
            echo "Every gate ran on this commit and every artifact was built. A real run would have shipped:"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| package | \`$PACKAGE_NAME\` |"
            echo "| version | \`$VERSION\` |"
            echo "| tarball | \`$TARBALL\` |"
            echo "| SHA-256 | \`$TARBALL_SHA256\` |"
            echo "| dist-tag | \`$DIST_TAG\` |"
            echo "| registry | the STAMITY_RELEASE_REGISTRY variable, skipped if this integrity is already there |"
            echo "| GitHub release | \`v$VERSION\`, with the tarball and its \`.sha256\` |"
            echo ""
            echo "To publish for real: push the tag \`v$VERSION\`, or dispatch this workflow FROM that tag with \`dry_run\` set to false."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Dry run complete: $PACKAGE_NAME@$VERSION ($TARBALL, sha256 $TARBALL_SHA256)"
