# Release — the only path that publishes, split into jobs that run code and a job that holds the
# credential.
#
# THE SPLIT. `gates` runs every third-party binary in the release path (the build, the suite, the
# leak gate, the packed-artifact smoke) on the exact shipping commit, and holds NO OIDC token.
# `publish` holds the npm trusted-publishing token and runs only npm, git, the GitHub CLI and four
# SHA-pinned actions against a tarball whose SHA-256 it verifies against a job OUTPUT — a channel
# separate from the artifact it verifies, because a digest carried inside the artifact it attests
# is circular. A compromised devDependency therefore cannot mint a publish credential: the job it
# runs in does not have one.
#
# THE SECOND PUBLISHED SURFACE. The same release ships a PLUGIN DISTRIBUTION: four client roots
# with this package's runtime bundled in each, their archives, their catalogs and a manifest.
# `gates` builds it from the packed tarball and states the manifest's digest on the outputs
# channel; `publish` verifies that digest, attests the archives, pushes the tree as one orphan
# commit on the distribution branch with a `plugins/v<version>` tag, and attaches the archives,
# the checksums and the manifest to the GitHub release. The branch is replaced on every release
# by design and the tag is what keeps every earlier one reachable.
#
# THE THIRD JOB, AND WHY THE SPLIT HAS ONE MORE LINE IN IT. `apm-route` proves the published APM
# route against the canonical remote at the release sha. It runs a third-party INTERPRETER — pip's
# unpinned closure and apm itself — so it holds no credential and has no path to the packed
# artifact: it never checks out the build, never sees `dist/` or the tarball, and uploads nothing.
# It needs nothing from `gates` and runs beside it; `publish` needs both, so its result gates the
# release without ever sharing a filesystem with the bytes that ship.
#
# THE REHEARSAL. `workflow_dispatch` takes a `dry_run` input that DEFAULTS TO TRUE. A dispatch
# that leaves it alone runs every gate, packs the tarball, generates the SBOM and prints what it
# would have published — and cannot publish. Three independent things enforce that, so no single
# edit re-opens it:
#   1. `publish` runs only on a `v*` tag push, or on a dispatch that set `dry_run` to literally
#      false. An absent or empty input matches neither arm — see the condition on the job.
#   2. `publish` re-asserts the same fact as its first step and fails closed.
#   3. `npm publish` appears in exactly one job in this repository, and it is that one.
#
# THE DISPATCH PUBLISH ARM. A dispatch with `dry_run` set to false IS a real release, so it is
# held to the same proofs as a tag push rather than trusted because a human clicked it: the
# `gates` job requires three proofs of the dispatched ref — (1) it is a `v*` TAG; (2) the tag
# name equals the version package.json declares; (3) the tagged commit is reachable from
# origin/main. All three run before the pack step, so a dispatch from a branch — or from a tag
# naming another version — fails this workflow before anything irreversible happens. A dry run
# skips those three proofs because it publishes nothing, and prints which ones it skipped and
# why rather than going quiet.
# test/ci/workflow.test.ts evaluates both job conditions against every trigger shape and runs the
# proof script itself against a scratch repository.
#
# Actions are pinned to full commit SHAs with a trailing comment naming the EXACT version the SHA
# resolves to. Pins resolved 2026-08-26 with:
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every gate and pack the tarball without publishing'
        type: boolean
        default: true

# Least privilege at workflow scope: `gates` inherits contents: read and nothing more. The publish
# job elevates itself. Holding id-token off the workflow scope is what keeps the trusted-publishing
# credential out of every job that runs third-party build code.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release mid-flight: `npm publish` is not reversible on a whim (npm blocks
  # unpublish after 72 hours), so a half-cancelled release is worse than a queued one.
  cancel-in-progress: false

jobs:
  # ── Job 1: gates + pack. No id-token, no publish credential. ────────────────
  gates:
    name: gates and pack
    # Imported repositories may retain canonical metadata and historical tags. Only GitHub's
    # current repository context authorizes this public release path; downstreams configure
    # their own private release lane. String comparison refuses absent privacy metadata too.
    if: github.repository == 'zomarit/stamity' && format('{0}', github.event.repository.private) == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      package_name: ${{ steps.resolve.outputs.package_name }}
      tarball: ${{ steps.pack.outputs.tarball }}
      tarball_sha256: ${{ steps.pack.outputs.tarball_sha256 }}
      sbom_present: ${{ steps.sbom.outputs.sbom_present }}
      # The plugin distribution's identity, on the same channel and for the same reason: the
      # publish job re-derives the manifest's digest from THIS value, never from a file riding
      # inside the artifact it is verifying.
      plugins_manifest_sha256: ${{ steps.plugins.outputs.plugins_manifest_sha256 }}
      plugins_branch: ${{ steps.plugins.outputs.plugins_branch }}
      plugins_tag: ${{ steps.plugins.outputs.plugins_tag }}
      plugins_archives: ${{ steps.plugins.outputs.plugins_archives }}

    steps:
      # First step, before anything downloads or executes. `egress-policy: block` fails the job
      # closed on any destination not listed below, which is the property that makes the rest of
      # this job's third-party code safe to run: it can be compromised and still cannot phone
      # anywhere. `disable-sudo` removes the runner's privilege-escalation path.
      #
      # Every entry maps to a step's egress; a missing entry fails the job closed rather than
      # leaking. This job holds no token, so the OIDC and Sigstore hosts the publish job needs
      # are deliberately absent here — they are not reachable from this job and must not be.
      #   api.github.com, github.com    — the depth-0 checkout and the setup-node manifest
      #   nodejs.org                    — the Node download setup-node performs
      #   objects.githubusercontent.com — GitHub's object and manifest CDN
      #   registry.npmjs.org            — npm ci, and the tarball smoke's consumer install
      #   results-receiver.actions.githubusercontent.com,
      #   productionresultssa0..19.blob.core.windows.net — GitHub artifact storage
      #
      # The Python index and CDN are deliberately absent: the APM route smoke runs a third-party
      # interpreter and now lives in the `apm-route` job below, which is where those hosts are
      # listed. Nothing in this job reaches them.
      #
      # Reviewed 2026-09-10 against connections on release 34509238734 and rehearsal
      # 34500672177 plus api.github.com/meta domains.actions. GitHub currently names
      # twenty result-storage accounts; retain the complete official set, not the
      # one account a single run contacted. No arbitrary Azure storage is admitted.
      # Recheck that endpoint contract when GitHub changes the roster. The pinned
      # hardener also manages runner-service/cache endpoints; see release-egress.md.
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            productionresultssa0.blob.core.windows.net:443
            productionresultssa1.blob.core.windows.net:443
            productionresultssa2.blob.core.windows.net:443
            productionresultssa3.blob.core.windows.net:443
            productionresultssa4.blob.core.windows.net:443
            productionresultssa5.blob.core.windows.net:443
            productionresultssa6.blob.core.windows.net:443
            productionresultssa7.blob.core.windows.net:443
            productionresultssa8.blob.core.windows.net:443
            productionresultssa9.blob.core.windows.net:443
            productionresultssa10.blob.core.windows.net:443
            productionresultssa11.blob.core.windows.net:443
            productionresultssa12.blob.core.windows.net:443
            productionresultssa13.blob.core.windows.net:443
            productionresultssa14.blob.core.windows.net:443
            productionresultssa15.blob.core.windows.net:443
            productionresultssa16.blob.core.windows.net:443
            productionresultssa17.blob.core.windows.net:443
            productionresultssa18.blob.core.windows.net:443
            productionresultssa19.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            results-receiver.actions.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the ancestry probe below runs `git merge-base --is-ancestor` against
          # origin/main, and a depth-1 checkout has no main ref to resolve.
          fetch-depth: 0

      # Three proofs, answered before anything irreversible happens, on EVERY run that can
      # publish — a `v*` tag push AND a dispatch that set `dry_run` to false:
      #   1. the ref is a `v*` TAG;
      #   2. the tag names the version package.json declares;
      #   3. the tagged commit is reachable from origin/main.
      # A `v*` tag pushed from any branch triggers this workflow, and the dispatch form offers
      # every branch and tag in the repository. Without proof 3 a release could ship a commit
      # that never reached `main`; without proof 2 the published version and the tag would
      # disagree; without proof 1 a real-publish dispatch could ship an arbitrary branch tip with
      # neither of the other two even applicable. A dispatch from a branch cannot satisfy proof 1
      # at all, and that is the intent: a real publish comes from a tag or it does not happen.
      #
      # Which runs can publish is one fact with two spellings — the `publish` job's condition and
      # the REQUIRE_PROOFS gate below — and they are written to admit exactly the same set. The
      # lower-casing below is part of that: GitHub's `==` is case-insensitive on strings while
      # `[ = ]` is not.
      #
      # Honesty boundary, because the guard lives inside the artifact it guards: a tag-triggered
      # run executes the release.yml present AT THE TAGGED COMMIT. Someone with write access who
      # tags a branch carrying a release.yml with this step deleted is not stopped by it. The
      # durable closures are platform-side and are repository settings rather than file edits —
      # a required reviewer on the `npm-publish` environment, a `v*` tag ruleset, and the
      # job split in this file that keeps the token away from third-party code.
      #
      # On a DRY RUN the three proofs are skipped rather than waived, and the step prints which
      # ones and why: a rehearsal publishes nothing, so there is nothing irreversible for them to
      # gate, and the rehearsal has to stay runnable from a feature branch — which is where a
      # release gets rehearsed, before any tag exists.
      - name: Resolve version
        id: resolve
        env:
          # Empty on a push, 'true' or 'false' on a dispatch. It reaches the shell through `env:`
          # rather than a `${{ }}` interpolation in the body, like every other value in this file.
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"

          DRY_RUN="$(printf '%s' "${DRY_RUN_INPUT:-}" | tr '[:upper:]' '[:lower:]')"

          REQUIRE_PROOFS=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            REQUIRE_PROOFS=true
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" = "false" ]; then
            REQUIRE_PROOFS=true
          fi

          if [ "$REQUIRE_PROOFS" = "true" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) ;;
              *)
                echo "::error::A run that can publish must come from a v* tag, and this one is on $GITHUB_REF. Push the tag, or dispatch from the tag itself. A dispatch from a branch is a rehearsal: leave dry_run true."
                exit 1
                ;;
            esac

            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            TAG_SHA="$(git rev-list -n 1 "$GITHUB_REF")"
            echo "Tag $GITHUB_REF -> commit $TAG_SHA"

            # Resolved from the remote-tracking ref the depth-0 checkout already fetched, not
            # from a fresh `git fetch`: `persist-credentials: false` strips the auth header after
            # checkout, so a follow-up fetch has no credential to authenticate with and must not
            # be what this proof depends on. If the ref is missing, the checkout configuration
            # changed under this step — say that rather than skipping the ancestry proof.
            if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
              echo "::error::refs/remotes/origin/main is not present. The Checkout step must keep fetch-depth: 0, which fetches every branch into refs/remotes/origin/*. Refusing to release without the ancestry proof."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$TAG_SHA" refs/remotes/origin/main; then
              echo "::error::Tagged commit $TAG_SHA is not an ancestor of origin/main. Refusing to release."
              exit 1
            fi
            echo "Tag ancestry verified: $TAG_SHA is reachable from origin/main"

            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
              exit 1
            fi
            VERSION="$TAG_VERSION"
            echo "Version validated against the tag: $VERSION"
          else
            VERSION="$PKG_VERSION"
            echo "::notice title=Release rehearsal::Rehearsal on $GITHUB_REF. Nothing is published, so the three proofs a real run must pass were SKIPPED, not waived: (1) the ref is a v* tag; (2) the tag name equals v$PKG_VERSION, the version package.json declares; (3) the tagged commit is an ancestor of origin/main. A dispatch with dry_run set to false runs all three here and fails this job before the pack step if any does not hold."
            echo "Rehearsal — proofs skipped, because this run publishes nothing:"
            echo "  1. ref is a v* tag                          — this run is on $GITHUB_REF"
            echo "  2. tag name equals the declared version     — would have to be v$PKG_VERSION"
            echo "  3. tagged commit is an ancestor of origin/main"
            echo "Version from package.json: $VERSION"
          fi

          {
            echo "version=$VERSION"
            echo "package_name=$PKG_NAME"
          } >> "$GITHUB_OUTPUT"

      # `cache: npm` is deliberately absent. Actions caches are writable from any branch, so
      # restoring one into the environment that installs, builds and packs the shipped tarball
      # would hand a cross-branch write a path into the release artifact. The ~20 seconds are
      # not worth it here; ci.yml keeps the cache because nothing it produces ships.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # The env var takes precedence over .npmrc in npm's config order, so the lifecycle-script
      # deny holds even if a transitive Git dependency rewrites the project rc mid-install.
      - name: Install
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        run: npm ci

      - name: Verify lockfile is in sync
        run: git diff --exit-code package-lock.json

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Leak gate
        run: npm run gate

      - name: Dogfood check
        run: node dist/cli.js check

      # The published shape, packed and installed into a project that is not this one. This is
      # also the only place the leak gate sees the built payload: `dist/` is a skipped build
      # directory in a repository scan and is the entire package in a publish.
      - name: Tarball smoke (publish shape)
        run: node scripts/tarball-smoke.mjs

      # Pack the exact bytes the publish job will ship, and record their digest on the job-output
      # channel. The publish job compares against that output, never against a file riding inside
      # the artifact it is verifying.
      - name: Pack tarball
        id: pack
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --json --pack-destination . | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s)[0].filename))')"
          test -f "$TARBALL"
          SHA="$(sha256sum "$TARBALL" | awk '{print $1}')"
          {
            echo "tarball=$TARBALL"
            echo "tarball_sha256=$SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Packed: $TARBALL ($(wc -c < "$TARBALL") bytes)"
          echo "SHA-256: $SHA"

      # ── the plugin distribution ────────────────────────────────────────────
      #
      # The release publishes more than the npm package: four plugin roots, one per client, with
      # this package's own runtime bundled inside each of them. Both builds happen HERE, in the
      # job that holds no credential, and the publish job below receives the finished tree plus
      # its digest on the outputs channel — the same boundary the tarball already crosses.
      #
      # The runtime is built from the TARBALL the pack step just produced, never from the working
      # tree: `npm pack` is the only thing that knows what `files` publishes, and a runtime built
      # from the checkout would ship sources and fixtures the published package does not have
      # while passing every test.
      #
      # Both trees land under `dist/`, which is gitignored, rather than beside the checkout. An
      # untracked `plugin-runtime/` in the workspace would enter `git ls-files --others` — the
      # scan the leak gate itself runs — and every tree-cleanliness check after it, so a release
      # would start failing on its own build output.
      - name: Build plugin runtime
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node scripts/build-plugin-runtime.mjs --tarball "$TARBALL" --out dist/plugin-runtime

      # Provenance is an INPUT to this builder, never a clock read: the roots' capability files,
      # every archive entry's timestamp and `release.json` are all stamped from these two values,
      # which is what makes two builds of one commit produce identical bytes. The version comes
      # from package.json, which the tag proof above has already bound to the tag.
      #
      # The branch, the tag and the archive names are READ BACK OUT of the manifest the builder
      # wrote rather than spelled again here: `scripts/distribution-identity.mjs` owns those
      # values, and a second spelling in this file is a second thing to keep in step.
      - name: Build plugin distribution
        id: plugins
        run: |
          set -euo pipefail
          node scripts/build-plugin-distribution.mjs \
            --out dist/plugins \
            --runtime dist/plugin-runtime \
            --source-commit "$GITHUB_SHA" \
            --source-commit-date "$(git show -s --format=%cI "$GITHUB_SHA")"

          MANIFEST=dist/plugins/release.json
          test -f "$MANIFEST"
          SHA="$(sha256sum "$MANIFEST" | awk '{print $1}')"
          BRANCH="$(node -p 'JSON.parse(require("node:fs").readFileSync("dist/plugins/release.json","utf8")).distribution.branch')"
          TAG="$(node -p 'JSON.parse(require("node:fs").readFileSync("dist/plugins/release.json","utf8")).distribution.tag')"
          ARCHIVES="$(node -p 'JSON.parse(require("node:fs").readFileSync("dist/plugins/release.json","utf8")).packages.map((entry) => entry.archive).join(" ")')"
          if [ -z "$SHA" ] || [ -z "$BRANCH" ] || [ -z "$TAG" ] || [ -z "$ARCHIVES" ]; then
            echo "::error::The distribution manifest did not state its digest, branch, tag and archives. Refusing to hand an unidentified tree to the publish job."
            exit 1
          fi
          {
            echo "plugins_manifest_sha256=$SHA"
            echo "plugins_branch=$BRANCH"
            echo "plugins_tag=$TAG"
            echo "plugins_archives=$ARCHIVES"
          } >> "$GITHUB_OUTPUT"
          echo "Distribution: $TAG on $BRANCH"
          echo "Archives: $ARCHIVES"
          echo "release.json SHA-256: $SHA"

      # Seven days, for the reason the release artifact carries seven: this tree also has to
      # outlive the `npm-publish` environment's human approval, not just the run that built it.
      #
      # `include-hidden-files` is not optional here and is the whole reason this line exists:
      # EVERY catalog in this distribution lives in a dot directory (`.claude-plugin/`,
      # `.cursor-plugin/`, `.agents/plugins/`, `.github/plugin/`) and so does the APM primitive
      # tree (`.apm/`). The default drops hidden files with a warning, which would publish a
      # branch whose catalogs are all missing while every gate in this file stayed green.
      - name: Upload plugin distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-plugins
          path: dist/plugins
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # A CycloneDX component inventory of what actually ships. `--package-lock-only` reads the
      # lockfile rather than the installed tree, and `--omit dev` scopes the document to the
      # published dependency set — the same scope as the publish itself.
      #
      # Best-effort, and the file says which half of that is which: the SBOM is a FLOOR (a
      # release should carry one) but it is generated by a toolchain feature that can change
      # shape between npm releases, so a failure here warns and records `sbom_present=false`
      # rather than failing the release closed. A missing SBOM is visible on the run and in the
      # release body; it never silently downgrades to green.
      - name: Generate SBOM (CycloneDX)
        id: sbom
        run: |
          set -uo pipefail
          if npm sbom --sbom-format cyclonedx --package-lock-only --omit dev > sbom.cdx.json 2> sbom.err; then
            echo "sbom_present=true" >> "$GITHUB_OUTPUT"
            echo "SBOM generated: $(wc -c < sbom.cdx.json) bytes"
          else
            rm -f sbom.cdx.json
            echo "sbom_present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=SBOM not generated::npm sbom failed; this release will carry no component inventory. Output follows."
            cat sbom.err || true
          fi
          rm -f sbom.err

      # A deterministic release body, written here so the publish job needs no checkout and no
      # generator. CHANGELOG.md now exists (Keep a Changelog format, `## [x.y.z] - YYYY-MM-DD`
      # headings), so this step extracts the section for THIS version HERE — ahead of the
      # irreversible publish — rather than after it, so a missing section cannot leave npm
      # published and the GitHub release never created. The extraction is FAIL-CLOSED: a version
      # with no matching section fails this step before the pack is ever handed to the publish
      # job. That is the reading the boundary demands — a release that cannot describe itself does
      # not ship.
      #
      # Every value reaches the shell through `env:` rather than a `${{ }}` interpolation inside
      # the script body. The interpolated form substitutes text BEFORE the shell parses it, so a
      # value carrying a quote or a backtick would be parsed as script — and these values come
      # from package.json and from a pack step, which is close enough to attacker-influenced to
      # be worth not doing. VERSION reaches the awk program below through `-v` from the shell's own
      # env, never through a `${{ }}` interpolation.
      - name: Compose release notes
        env:
          PACKAGE_NAME: ${{ steps.resolve.outputs.package_name }}
          VERSION: ${{ steps.resolve.outputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          TARBALL_SHA256: ${{ steps.pack.outputs.tarball_sha256 }}
          SBOM_PRESENT: ${{ steps.sbom.outputs.sbom_present }}
        run: |
          set -euo pipefail

          # Extract the CHANGELOG section for this exact version. The heading is `## [VERSION] …`;
          # awk starts printing after the matching heading and stops at the next `## [` heading, so
          # it yields that section's body and no other. A `## [1.0.1]` target never matches a
          # `## [1.0.10]` heading, because the bracketed target ends in `]`. `found` gates the
          # fail-closed exit; a whitespace-only body is treated as missing too.
          #
          # The Keep-a-Changelog link-reference footer (`[x]: url`) is HELD, not stopped on. It
          # used to end the section outright, which is right for a footer and wrong for anything
          # after one: a `[note]: …` reference defined mid-body silently truncated every entry
          # below it out of the published notes, with nothing failing. So link-def lines (and the
          # blanks between them) go into a hold buffer; a real line after them flushes the buffer
          # and printing continues, and a buffer still held at the end of the section — which is
          # exactly the trailing footer — is discarded.
          if [ ! -f CHANGELOG.md ]; then
            echo "::error title=No changelog::CHANGELOG.md is missing. A release must carry a changelog section for its version before it publishes."
            exit 1
          fi
          CHANGELOG_SECTION="$(
            awk -v target="## [$VERSION]" '
              index($0, "## [") == 1 {
                if (substr($0, 1, length(target)) == target) { printing = 1; found = 1; next }
                if (printing) { printing = 0 }
              }
              printing && /^\[[^][]+\]:[ \t]/ { held[++n] = $0; next }
              printing && n > 0 && /^[ \t]*$/ { held[++n] = $0; next }
              printing {
                for (i = 1; i <= n; i++) print held[i]
                n = 0
                print
                next
              }
              END { if (!found) exit 3 }
            ' CHANGELOG.md
          )" || {
            echo "::error title=No changelog section::CHANGELOG.md has no \"## [$VERSION]\" section. Add the section for this version before releasing — a release that cannot describe itself does not ship."
            exit 1
          }
          if [ -z "$(printf '%s' "$CHANGELOG_SECTION" | tr -d '[:space:]')" ]; then
            echo "::error title=Empty changelog section::CHANGELOG.md has a \"## [$VERSION]\" heading but no entries under it. Fill the section before releasing."
            exit 1
          fi

          {
            echo "## $PACKAGE_NAME v$VERSION"
            echo ""
            echo "Built from \`$GITHUB_SHA\` by \`.github/workflows/release.yml\`."
            echo ""
            echo "### Changes"
            echo ""
            echo "$CHANGELOG_SECTION"
            echo ""
            echo "| Artifact | SHA-256 |"
            echo "| --- | --- |"
            echo "| \`$TARBALL\` | \`$TARBALL_SHA256\` |"
            echo ""
            if [ "$SBOM_PRESENT" = "true" ]; then
              echo "A CycloneDX SBOM (\`sbom.cdx.json\`) is attached to this release."
            else
              echo "**No SBOM is attached to this release** — generation failed during the run."
            fi
            echo ""
            echo "Published to npm with provenance through GitHub OIDC trusted publishing."
          } > release-notes.md
          cat release-notes.md

      # The privilege boundary. Nothing token-capable produced any of these files, and the
      # publish job verifies the tarball's digest against this job's output before it ships it.
      #
      # Seven days of retention, because the hand-off is not machine-paced: `publish` sits behind
      # the `npm-publish` environment's required-reviewer gate, so the artifact has to outlive a
      # HUMAN approval, not just this run. One day did not — a v1.0.0 publish failed on
      # 2026-08-30 when the approval landed after the artifact had expired and the download step
      # had nothing to fetch. Seven days covers a reviewer who approves the next working day, or
      # over a weekend, and changes nothing about the trust boundary: the digest the publish job
      # verifies still travels on the `gates` job's outputs, never inside the artifact.
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: |
            *.tgz
            sbom.cdx.json
            release-notes.md
          if-no-files-found: error
          retention-days: 7

  # ── Job 2: the APM route. A third-party interpreter, in a job with nothing to steal. ──
  #
  # The FIFTH published surface, proven against the canonical remote at the exact commit this
  # release ships — not against the checkout. `apm install zomarit/stamity#<sha>` is the route a
  # consumer takes, resolved through git rather than through this working tree, so it is the only
  # form that can catch a package correct on disk and unreachable through the resolver: that is
  # precisely the failure this smoke was written for (apm's type-detection cascade ranked this
  # repository's plugin manifest ahead of `apm.yml` + `.apm/` through 0.29.0, deploying zero
  # primitives while exiting 0 — microsoft/apm#2735, fixed in 0.29.1).
  #
  # WHY IT IS ITS OWN JOB, AND NOT A STEP IN `gates`. This step runs a third-party interpreter and
  # an unpinned pip closure — apm-cli's own dependency tree, resolved at run time — and then runs
  # apm itself over a network fetch. `gates` is the job that builds and PACKS the shipping tarball,
  # so anything executing there shares a filesystem with the artifact the publish job ships. This
  # job holds no credential and has NO path to the packed artifact: it installs from the remote at
  # the release sha, never checks out the build, never sees `dist/` or the tarball, and uploads
  # nothing. Its result still gates the release — `publish` needs it — so a route this release
  # cannot serve is a reason not to ship rather than a note to file after publishing.
  #
  # A sha is what a tag push resolves to anyway, and apm resolves one directly, so the gate runs on
  # the shipping commit even before its tag exists on the remote. It needs nothing from `gates` and
  # runs beside it, on the same triggers.
  apm-route:
    name: apm route smoke
    # This credential-free job resolves the canonical remote, so a downstream/private SHA
    # cannot be sent through it as if it were a canonical release candidate.
    if: github.repository == 'zomarit/stamity' && format('{0}', github.event.repository.private) == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      # Audited in both observed runs named in release-egress.md: this job already
      # contains no broad artifact-storage allowance and needs its Python/fallback hosts.
      # Same fail-closed posture as every other job here, over the hosts THIS job needs and no
      # others. The three Python hosts moved here with the step that reaches them:
      #   api.github.com, github.com    — the depth-1 checkout and setup-node's version manifest
      #   objects.githubusercontent.com — GitHub's object and manifest CDN, where the setup actions
      #                                   fetch the interpreter and the Node build from
      #   pypi.org, files.pythonhosted.org — the apm-cli index and wheel for the venv below
      #   raw.githubusercontent.com     — actions/setup-python's fallback versions manifest; its
      #                                   primary read is the api.github.com contents endpoint
      #                                   above, and a blocked fallback would fail this job closed
      # `registry.npmjs.org` is absent because this job installs nothing from npm, and the OIDC and
      # Sigstore hosts are absent for the reason they are absent from `gates`: no token lives here.
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443

      # Depth 1, and only for `scripts/apm-install-smoke.mjs`. This job does not build, does not
      # install this package's dependencies and never reads the tree under test — the package it
      # verifies comes from the remote at the release sha, which is the whole point of the route.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Pinned for the same reason the Node version is: a runner-image refresh must not move an
      # interpreter the release path depends on. apm-cli declares `python >= 3.10`.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # The venv lives in RUNNER_TEMP rather than in the checkout, so nothing pip resolves can sit
      # in the tree — a habit worth keeping even in a job that packs nothing.
      - name: APM route smoke (canonical ref)
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/apm-venv"
          "$RUNNER_TEMP/apm-venv/bin/pip" install --quiet "apm-cli==0.30.0"
          "$RUNNER_TEMP/apm-venv/bin/apm" --version
          node scripts/apm-install-smoke.mjs --apm "$RUNNER_TEMP/apm-venv/bin/apm" --source "zomarit/stamity#${SHA}" --targets claude,copilot,cursor,codex

  # ── Job 3: publish. The only job with a credential, and the only job that ships. ──
  #
  # The condition, spelled out because it is the safety property of this file:
  #   - a `v*` TAG push publishes (`inputs` is empty on a push, so no input is consulted);
  #   - a dispatch publishes ONLY when dry_run was set to literally false;
  #   - every other shape — the default dispatch, a dispatch whose input went missing, a branch
  #     push, a schedule — matches neither arm.
  #
  # Why `format('{0}', inputs.dry_run) == 'false'` rather than `inputs.dry_run == false`. GitHub
  # casts operands of differing types to numbers before comparing, and null, the empty string and
  # false all cast to 0 — so `inputs.dry_run == false` is TRUE for an input that is ABSENT or
  # empty, not only for one a human set to false. That is fail-OPEN in the one place this file
  # cannot afford it. `format()` renders the value as a string first, so the comparison reads
  # 'false' against 'false': an absent input renders as the empty string and matches nothing.
  # (docs.github.com/actions/reference/evaluate-expressions-in-workflows-and-actions, accessed
  # 2026-08-26.) The input is declared `type: boolean` with `default: true` above, so the
  # fail-open shape is unreachable today — this is the spelling that keeps it unreachable if that
  # declaration is ever edited.
  #
  # The dispatch arm keys on dry_run alone, and does NOT re-test the ref here. The ref proofs
  # belong to the `gates` job, which this job needs: a dispatch from a branch reaches this
  # condition and never reaches this job, because gates failed before the pack step.
  #
  # It needs `apm-route` too, and needing it is what makes that job a gate rather than a report: a
  # release whose published route does not resolve never reaches the credential.
  publish:
    name: publish
    needs: [gates, apm-route]
    if: >-
      github.repository == 'zomarit/stamity' && format('{0}', github.event.repository.private) == 'false' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run) == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The single approval point. Configure required reviewers and a `v*` deployment tag policy on
    # this environment in repository settings — that is the platform-side control the in-file
    # ancestry probe cannot be.
    environment: npm-publish
    # The OIDC and release-write grants live here and nowhere else.
    #
    #   contents: write     `gh release create`, and the distribution branch and tag push
    #   id-token: write     npm's provenance over trusted publishing, and the Sigstore signing
    #                       certificate the plugin archives' attestation is issued under
    #   attestations: write persists that attestation on this repository
    #   artifact-metadata: write  creates its artifact storage record
    #
    # The last two arrived with the plugin archives, which are attested by an action rather than
    # by npm; `actions/attest-build-provenance` names all three writes in its own README. No job
    # that runs third-party build code holds any of them.
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      # Belt and braces on the job condition above. If a future edit widens the `if:`, this fails
      # the job before the credential is used for anything.
      #
      # It refuses every dispatch that is not a confirmed real run — dry_run true, and equally
      # dry_run absent or empty — rather than only the literal `true` case. The narrower spelling
      # would have let exactly the fail-open shape the job condition guards against walk past the
      # backstop that exists to catch it.
      #
      # Deliberately ahead of the runner hardening below, which is otherwise the first step
      # everywhere in this file: this step opens no socket and reads no file, so there is nothing
      # for the egress policy to protect, and stopping a run that should not have started is worth
      # more than the seconds the monitor would take to install first.
      - name: Refuse a dispatch that is not a confirmed real run
        if: github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run) != 'false'
        run: |
          echo "::error::This dispatch did not set dry_run to false, and the publish job started anyway. The job condition has drifted. Failing closed."
          exit 1

      # Restate the destination before any network interaction if a later edit widens `if:`.
      - name: Refuse a noncanonical publication destination
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_REPOSITORY" != 'zomarit/stamity' ] || [ "$RELEASE_REPOSITORY_PRIVATE" != 'false' ]; then
            echo '::error::Canonical public publication requires the public zomarit/stamity repository. Configure a separate private downstream release path.'
            exit 1
          fi

      # Same fail-closed egress policy, on the job that holds the highest-value credential in the
      # repository. Allowlist is the publish-capability subset plus the artifact download:
      #   api.github.com                — setup-node manifest, `gh release create`, and the
      #                                   attestations API the plugin-archive attestation is
      #                                   persisted through
      #   github.com                    — the same, plus the distribution branch and tag push
      #   nodejs.org                    — the Node download setup-node performs
      #   objects.githubusercontent.com — GitHub's object and manifest CDN
      #   registry.npmjs.org            — the global npm upgrade and `npm publish`
      #   token.actions.githubusercontent.com — the GitHub OIDC token (id-token: write)
      #   fulcio.sigstore.dev, rekor.sigstore.dev, tuf-repo-cdn.sigstore.dev
      #                                 — the provenance attestation npm publishes, AND the
      #                                   signing certificate, transparency entry and TUF root
      #                                   `actions/attest-build-provenance` uses for the plugin
      #                                   archives. Two consumers, one set of hosts: dropping npm
      #                                   provenance would not make these removable.
      #   uploads.github.com            — release asset upload
      #   results-receiver.actions.githubusercontent.com,
      #   productionresultssa0..19.blob.core.windows.net — GitHub artifact storage
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            productionresultssa0.blob.core.windows.net:443
            productionresultssa1.blob.core.windows.net:443
            productionresultssa2.blob.core.windows.net:443
            productionresultssa3.blob.core.windows.net:443
            productionresultssa4.blob.core.windows.net:443
            productionresultssa5.blob.core.windows.net:443
            productionresultssa6.blob.core.windows.net:443
            productionresultssa7.blob.core.windows.net:443
            productionresultssa8.blob.core.windows.net:443
            productionresultssa9.blob.core.windows.net:443
            productionresultssa10.blob.core.windows.net:443
            productionresultssa11.blob.core.windows.net:443
            productionresultssa12.blob.core.windows.net:443
            productionresultssa13.blob.core.windows.net:443
            productionresultssa14.blob.core.windows.net:443
            productionresultssa15.blob.core.windows.net:443
            productionresultssa16.blob.core.windows.net:443
            productionresultssa17.blob.core.windows.net:443
            productionresultssa18.blob.core.windows.net:443
            productionresultssa19.blob.core.windows.net:443
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            results-receiver.actions.githubusercontent.com:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443

      # No `cache: npm` here either, and this job additionally holds the OIDC token.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or newer. The runner's bundled npm tracks the Node
      # image and can lag, so upgrade and then ASSERT the floor rather than assuming the upgrade
      # produced a version that clears it.
      - name: Upgrade npm for trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@12.0.2 # pinned exact (2026-08-26); bump deliberately, never float
          NPM_VERSION="$(npm --version)"
          MIN='11.5.1'
          if [ "$(printf '%s\n%s\n' "$MIN" "$NPM_VERSION" | sort -V | head -1)" != "$MIN" ]; then
            echo "::error::npm $NPM_VERSION is below the $MIN floor that OIDC trusted publishing requires."
            exit 1
          fi
          echo "npm $NPM_VERSION clears the $MIN trusted-publishing floor"

      # No checkout in this job. npm builds provenance from the Actions OIDC context and the run
      # environment, not from a local .git tree, so the publish stays isolated from the source
      # the gates ran against.
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist

      # The expected digest comes from the gates job's output, a channel that never traveled
      # inside the artifact under verification. An empty expected value fails closed too: a
      # missing output must not read as a match.
      - name: Verify tarball digest
        env:
          EXPECTED_SHA: ${{ needs.gates.outputs.tarball_sha256 }}
          EXPECTED_TARBALL: ${{ needs.gates.outputs.tarball }}
        run: |
          set -euo pipefail
          TARBALL="$EXPECTED_TARBALL"
          if [ -z "$TARBALL" ] || [ ! -f "$TARBALL" ]; then
            echo "::error::The gates job packed '$EXPECTED_TARBALL' but the downloaded artifact does not carry it. Refusing to publish."
            exit 1
          fi
          ACTUAL_SHA="$(sha256sum "$TARBALL" | awk '{print $1}')"
          if [ -z "$EXPECTED_SHA" ] || [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Tarball digest mismatch: gates output '$EXPECTED_SHA' vs downloaded '$ACTUAL_SHA'. Refusing to publish."
            exit 1
          fi
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          echo "Digest verified against the gates job output: $TARBALL ($ACTUAL_SHA)"

      # ── the plugin distribution: fetched and verified BEFORE the publish ───
      #
      # These two are ordered AHEAD of `npm publish`, and the reason is what a failure in each
      # half costs. Everything this job does with the distribution after the publish — the
      # attestation, the branch and tag push, the stamp — can be run again: the orphan commit is
      # a pure function of the tree it carries, so a second run rebuilds the same sha and moves
      # no ref. Fetching and verifying is the half that can only say no — a missing artifact, a
      # digest that does not match the gates output — and saying it after npm had published
      # would leave a version on the registry that no re-run of this job can finish, because
      # `npm publish` refuses the version it already shipped. So the steps that can only refuse
      # run before the one irreversible step, and the ones that can be repeated run after it.
      #
      # This job still checks nothing out. The tree it publishes is the artifact the gates job
      # built, and the only thing that makes it trustworthy is the digest check below — a value
      # that travelled on the job-output channel, not inside the tree it describes.
      - name: Download plugin distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-plugins
          path: plugins

      - name: Verify plugin distribution digest
        env:
          EXPECTED_SHA: ${{ needs.gates.outputs.plugins_manifest_sha256 }}
        run: |
          set -euo pipefail
          MANIFEST=plugins/release.json
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::The gates job built a plugin distribution but the downloaded artifact carries no release.json. Refusing to publish."
            exit 1
          fi
          ACTUAL_SHA="$(sha256sum "$MANIFEST" | awk '{print $1}')"
          if [ -z "$EXPECTED_SHA" ] || [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Plugin manifest digest mismatch: gates output '$EXPECTED_SHA' vs downloaded '$ACTUAL_SHA'. Refusing to publish."
            exit 1
          fi
          # The manifest is trusted from here, so every archive is checked against the digest IT
          # carries. That is what puts the whole tree on the outputs channel rather than letting
          # the artifact's own checksum files attest the artifact they ride in.
          node -e '
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const manifest = JSON.parse(fs.readFileSync("plugins/release.json", "utf8"));
            const packages = manifest.packages ?? [];
            if (packages.length === 0) {
              console.log("::error::release.json lists no packages, so there is nothing to verify. Refusing to publish.");
              process.exit(1);
            }
            let bad = 0;
            for (const entry of packages) {
              const path = `plugins/${entry.archive}`;
              if (!fs.existsSync(path)) {
                console.log(`::error::${entry.archive} is named by the verified manifest and missing from the artifact. Refusing to publish.`);
                bad += 1;
                continue;
              }
              const actual = crypto.createHash("sha256").update(fs.readFileSync(path)).digest("hex");
              if (actual === entry.sha256) {
                console.log(`${entry.archive}: ${actual}`);
              } else {
                console.log(`::error::${entry.archive} hashes to ${actual} and the verified manifest says ${entry.sha256}. Refusing to publish.`);
                bad += 1;
              }
            }
            if (bad > 0) process.exit(1);
          '
          echo "Plugin distribution verified against the gates job output: $ACTUAL_SHA"

      # No token env, deliberately. Authentication is npm trusted publishing over the OIDC token
      # this job's `id-token: write` grant mints, which is why no npm credential is stored in this
      # repository at all. That requires a ONE-TIME maintainer setup on npmjs.com: on the package
      # settings page, add a trusted publisher naming this repository, this workflow file
      # (`.github/workflows/release.yml`) and the `npm-publish` environment. Until that entry
      # exists the publish fails with an authentication error — which is the correct failure, not
      # a reason to add a token.
      #
      # `--provenance` is explicit as a fallback for a local emergency publish; the trusted
      # publisher entry is the attestation mechanism of record.
      - name: Publish to npm with provenance
        run: npm publish "./$TARBALL" --provenance --access public

      # ── the plugin distribution: published after the npm publish ───────────
      #
      # From here on the release is irreversible on the registry, so these steps are ordered
      # after it rather than racing it — and each of them can be run again on the same commit if
      # one of them fails, which is why they are the half that sits on this side of the line.
      #
      # Build provenance for the archives a consumer downloads from the release page. npm signs
      # the tarball through trusted publishing; nothing signs these, so the action does — over the
      # same OIDC token and the same Sigstore public-good instance, which is why this job's egress
      # list needs no new destination for it. Verified with `gh attestation verify <archive>`.
      - name: Attest plugin archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: plugins/*.zip

      # The distribution branch: one orphan commit per release, and one tag that never moves.
      #
      # The branch head is REPLACED every time, by design. The tree is published whole — four
      # roots, four catalogs, an APM package and a manifest that describe one version — and a
      # merge of two releases' catalogs would describe neither. What keeps history is the tag:
      # `plugins/v<version>` is created once, and every earlier release stays fetchable through
      # its own, which is why the tag check below fails closed rather than forcing.
      - name: Push plugin distribution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.gates.outputs.version }}
          BRANCH: ${{ needs.gates.outputs.plugins_branch }}
          TAG: ${{ needs.gates.outputs.plugins_tag }}
        run: |
          set -euo pipefail
          if [ -z "$BRANCH" ] || [ -z "$TAG" ]; then
            echo "::error::The gates job did not name the distribution branch and tag. Refusing to push an unidentified tree."
            exit 1
          fi
          # Actions masks this job's token in every log line, and the URL is never written into a
          # repository config: each git invocation receives it directly.
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"

          # Two shape checks on the names the gates job read out of a manifest it wrote AFTER
          # third-party build code had run in that job's writable checkout (SEC5-W1). This job
          # holds the only credential that can push, so it does not trust the manifest's word
          # for where to. Neither name is spelled here — the identity owns both — but their
          # shape is known: the tag is `<namespace>/v<version>` for the version the gates job
          # emitted, and the branch (checked below, once the remote is read) only ever holds an
          # orphan commit.
          case "$TAG" in
            */v"$VERSION") ;;
            *)
              echo "::error::$TAG is not a <namespace>/v$VERSION tag. Refusing to publish under a tag the distribution identity did not shape."
              exit 1
              ;;
          esac

          cd plugins
          SOURCE_DATE="$(node -p 'JSON.parse(require("node:fs").readFileSync("release.json","utf8")).sourceCommitDate')"

          git init -q
          git checkout -q --orphan "$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # `-f`, because a dependency inside the bundled runtime may ship a .gitignore of its
          # own, and a published tree that quietly lost files is worse than a failed release.
          git add -A -f
          # Both git dates come from the manifest rather than from the clock, so ONE release
          # produces ONE commit however often this step runs: fixed tree, fixed message, fixed
          # dates, fixed sha. That is what makes the tag check below idempotent on a re-run
          # instead of permanently fatal after a partial failure.
          GIT_AUTHOR_DATE="$SOURCE_DATE" GIT_COMMITTER_DATE="$SOURCE_DATE" \
            git commit -q -m "plugins: v$VERSION from $GITHUB_SHA"
          DIST_COMMIT="$(git rev-parse HEAD)"
          git tag "$TAG"

          # Read the remote BEFORE pushing anything. A tag already naming another commit is a pin
          # consumers fetch, and repointing it is the one thing this step must never do; checking
          # first is also what leaves the branch untouched when it refuses.
          EXISTING="$(git ls-remote "$REMOTE" "refs/tags/$TAG" | awk '{print $1}')"
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "$DIST_COMMIT" ]; then
            echo "::error::$TAG already exists at $EXISTING and this release built $DIST_COMMIT. Refusing to move a published distribution tag."
            exit 1
          fi
          # The head this force-push replaces must be a distribution head — one orphan commit —
          # or absent, on a first publish. A head with a parent is a source branch whatever the
          # manifest called it (SEC5-W1). Depth 2, not 1: a depth-1 fetch hides every parent and
          # would accept anything.
          REMOTE_HEAD="$(git ls-remote --heads "$REMOTE" "refs/heads/$BRANCH" | awk '{print $1}')"
          if [ -n "$REMOTE_HEAD" ]; then
            git fetch -q --depth=2 "$REMOTE" "refs/heads/$BRANCH"
            PARENTS="$(git rev-list --parents -n 1 FETCH_HEAD | awk '{print NF - 1}')"
            if [ "$PARENTS" != "0" ]; then
              echo "::error::$BRANCH's head $REMOTE_HEAD has a parent, so it is not a distribution head. Refusing to force-push over a branch that carries history."
              exit 1
            fi
          fi

          git push --force "$REMOTE" "HEAD:refs/heads/$BRANCH"
          if [ -z "$EXISTING" ]; then
            git push "$REMOTE" "refs/tags/$TAG"
            echo "Pushed $BRANCH and $TAG at $DIST_COMMIT"
          else
            echo "$TAG already points at $DIST_COMMIT; nothing to push (an idempotent re-run)."
          fi
          echo "PLUGINS_COMMIT=$DIST_COMMIT" >> "$GITHUB_ENV"

      # The commit a tree lands on is the one fact its builder cannot know while building it, so
      # `release.json` carries `distribution.commit: null` until the push above. The BRANCH keeps
      # that copy — a consumer reading the branch is reading the tree at a ref it already knows —
      # and the release ASSET gets the sha stamped in here.
      #
      # One field, stamped rather than re-rendered, and the reason is this job's design: it checks
      # nothing out, so `scripts/build-plugin-distribution.mjs` is not present, and a re-render
      # would additionally need the corpus and the runtime, neither of which rides the artifact.
      # The builder's contract is that `--distribution-commit` changes exactly this scalar in the
      # manifest, so the stamp refuses to run unless it finds the `null` it expects.
      - name: Stamp the release manifest with the distribution commit
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const path = "plugins/release.json";
            const commit = process.env.PLUGINS_COMMIT ?? "";
            if (!/^[0-9a-f]{40}$/.test(commit)) {
              console.log("::error::PLUGINS_COMMIT is not a 40-character lowercase commit sha, so the release asset cannot state where this tree landed.");
              process.exit(1);
            }
            const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
            if (manifest.distribution.commit !== null) {
              console.log(`::error::${path} already carries a distribution commit (${manifest.distribution.commit}). The branch keeps the null copy and this stamp runs once.`);
              process.exit(1);
            }
            manifest.distribution.commit = commit;
            fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
            console.log(`release.json stamped for the release assets: distribution.commit = ${commit}`);
          '

      # The tarball and the SBOM ride the release so a consumer can fetch the exact bytes and the
      # component inventory without re-running anything. `gh` is preinstalled on the runner, so
      # this needs no third-party action and no extra pin.
      #
      # `--verify-tag` and `--target` together close the mis-tagging gap. Without them
      # `gh release create` CREATES a missing tag, and it creates it on the default branch's head
      # — `gh release create --help`: "Target branch or full commit SHA (default [main branch])"
      # — so a release could carry a `v$VERSION` tag pointing at whatever `main` happened to be
      # when this step ran, while the tarball above came from the commit that was gated. Both
      # publish arms now require a `v*` tag that already exists, so `--verify-tag` is the right
      # posture: abort rather than invent one. `--target` names the gated commit for the case the
      # API would otherwise pick a default.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job checks out nothing (artifact-only by design), and without a git directory
          # `gh` cannot infer the repository from remotes — it exits "not a git repository"
          # before creating anything. GH_REPO names it explicitly; the v1.0.0 publish proved
          # the gap: npm publish succeeded and this step was the run's only failure.
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.gates.outputs.version }}
        run: |
          set -euo pipefail
          ASSETS="$TARBALL"
          if [ -f sbom.cdx.json ]; then
            ASSETS="$ASSETS sbom.cdx.json"
          fi
          # The plugin archives, their checksum files and the stamped manifest. Each is named as
          # MISSING rather than skipped: a release carrying three of the four archives reads
          # exactly like a complete one on the release page.
          for asset in plugins/*.zip plugins/*.sha256 plugins/release.json; do
            if [ ! -f "$asset" ]; then
              echo "::error::The plugin distribution is missing $asset — refusing to create a release that does not carry it."
              exit 1
            fi
            ASSETS="$ASSETS $asset"
          done
          # shellcheck disable=SC2086
          gh release create "v$VERSION" $ASSETS \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" \
            --verify-tag

  # ── Job 4: the rehearsal report. Runs instead of `publish`, never beside it. ──
  # A dispatch is only useful if it tells you what a real run would have done, so this prints the
  # exact artifact identity the publish job would have shipped.
  #
  # The condition is the exact complement of `publish`'s dispatch arm — `!= 'false'` against its
  # `== 'false'` — so on a dispatch exactly one of the two jobs runs, whatever the input is. The
  # earlier `inputs.dry_run == true` spelling left a hole between them: a dispatch whose input
  # went missing published nothing (correct) and reported nothing (silent), which is the one
  # outcome a rehearsal exists to prevent.
  dry-run-summary:
    name: dry run summary
    needs: gates
    if: github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run) != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Report what a real run would publish
        env:
          PACKAGE_NAME: ${{ needs.gates.outputs.package_name }}
          VERSION: ${{ needs.gates.outputs.version }}
          TARBALL: ${{ needs.gates.outputs.tarball }}
          TARBALL_SHA256: ${{ needs.gates.outputs.tarball_sha256 }}
          SBOM_PRESENT: ${{ needs.gates.outputs.sbom_present }}
          PLUGINS_BRANCH: ${{ needs.gates.outputs.plugins_branch }}
          PLUGINS_TAG: ${{ needs.gates.outputs.plugins_tag }}
          PLUGINS_ARCHIVES: ${{ needs.gates.outputs.plugins_archives }}
        run: |
          set -euo pipefail
          {
            echo "### Dry run — nothing was published"
            echo ""
            echo "Every gate ran on this commit and the tarball was packed. A real run would have shipped:"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| package | \`$PACKAGE_NAME\` |"
            echo "| version | \`$VERSION\` |"
            echo "| tarball | \`$TARBALL\` |"
            echo "| SHA-256 | \`$TARBALL_SHA256\` |"
            echo "| SBOM attached | \`$SBOM_PRESENT\` |"
            echo "| npm | \`publish --provenance --access public\` over OIDC trusted publishing |"
            echo "| GitHub release | \`v$VERSION\`, with the tarball, the SBOM and the plugin distribution attached |"
            echo "| plugin branch | \`$PLUGINS_BRANCH\`, replaced by one orphan commit |"
            echo "| plugin tag | \`$PLUGINS_TAG\`, created once and never moved |"
            echo "| plugin archives | \`$PLUGINS_ARCHIVES\` |"
            echo ""
            echo "The distribution was BUILT on this commit — the gates job packed the tarball, built the"
            echo "runtime from it and built the four roots, their archives and \`release.json\` — and uploaded"
            echo "as the \`release-plugins\` artifact. Nothing was pushed: the branch, the tag, the attestation"
            echo "and the release assets all live in the publish job, which a rehearsal never reaches."
            echo ""
            echo "The \`Resolve version\` step in the gates job lists the three release proofs this rehearsal skipped, and why."
            echo ""
            echo "To publish for real: push the tag \`v$VERSION\`, or dispatch this workflow FROM that tag with \`dry_run\` set to false. A real-publish dispatch from a branch fails in the gates job."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Dry run complete: $PACKAGE_NAME@$VERSION ($TARBALL, sha256 $TARBALL_SHA256, sbom=$SBOM_PRESENT)"
          echo "Would publish the distribution as $PLUGINS_TAG on $PLUGINS_BRANCH: $PLUGINS_ARCHIVES"
